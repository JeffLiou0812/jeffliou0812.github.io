      "body_original": "<p>Apple 過去五年的有效稅率（Effective Tax Rate, ETR）走勢是這樣的：13.3%、16.2%、14.7%，然後 FY2024 突然跳到 24.1%，FY2025 又回落到 15.6%。</p>\n\n  <p>美國聯邦法定稅率是 21%。一家公司多年繳得比法定低 5 到 8 個百分點，某一年又突然比法定高 3 個百分點，這裡面每一個數字都有故事。看懂這些故事，你對 Apple 淨利品質的判斷會比只看 EPS 的人深一層。</p>\n\n  <h2>先看數字</h2>\n\n  <table>\n    <tr><th>會計年度</th><th>所得稅費用</th><th>有效稅率 (ETR)</th><th>備註</th></tr>\n    <tr><td>FY2021</td><td>USD 14.5B</td><td>13.3%</td><td></td></tr>\n    <tr><td>FY2022</td><td>USD 19.3B</td><td>16.2%</td><td></td></tr>\n    <tr><td>FY2023</td><td>USD 16.7B</td><td>14.7%</td><td></td></tr>\n    <tr><td>FY2024</td><td>USD 29.7B</td><td>24.1%</td><td>含歐盟 State Aid 一次性補稅約 USD 10.2B</td></tr>\n    <tr><td>FY2025</td><td>USD 20.7B</td><td>15.6%</td><td>回歸結構性區間</td></tr>\n  </table>\n\n  <p>ETR 的公式很簡單：所得稅費用除以稅前淨利。難的不是算，是解讀。這篇拆兩件事：第一，Apple 平常年份為什麼能把 21% 變成 13-16%；第二，FY2024 那個 24.1% 是怎麼回事。</p>\n\n  <h2>四個結構性密碼：21% 怎麼變 13-16%</h2>\n\n  <h3>密碼一：海外營運效果（影響最大）</h3>\n  <p>Apple 全球銷售，但關鍵智慧財產（iOS、晶片設計、品牌）的經濟利益長年配置在愛爾蘭子公司。愛爾蘭傳統公司稅率 12.5%，低於美國的 21%，海外利潤適用較低稅率，直接把整體 ETR 往下拉。這是合法的稅制差異利用，10-K 所得稅附註裡「Foreign income taxed at rates lower than the U.S. statutory rate」那一行就是它。</p>\n\n  <h3>密碼二：GILTI 與 FDII 的一來一往</h3>\n  <p>2017 年美國稅改（TCJA）之後，GILTI 制度強制把海外受控公司的無形資產所得拉回美國課稅，方向是把 ETR 往上推；FDII 則給美國公司用美國智財賺取的海外所得優惠稅率，方向是往下拉。Apple 兩者都適用，淨效果仍然低於 21%。</p>\n\n  <h3>密碼三：研發稅額抵減（R&D Tax Credit）</h3>\n  <p>美國 IRC §41 給合格研發支出稅額抵減。注意這是 credit 不是 deduction：一塊錢抵一塊錢的稅，不是抵課稅所得。以 Apple 每年數百億美元等級的研發支出，這項每年穩定貢獻 1 到 2 個百分點的 ETR 下降。</p>\n\n  <h3>密碼四：股份基礎給酬的稅務超額利益</h3>\n  <p>會計上，股票薪酬（SBC）按授與日公允價值認列費用；稅務上按員工實際 vest 或行使時的價值抵稅。股價長期上漲的公司，稅上抵減金額大於帳上費用，產生所謂 windfall benefit，再貢獻零點幾個百分點。</p>\n\n  <h2>FY2024 的 24.1%：歐盟 State Aid 補稅</h2>\n\n  <p>2024 年 9 月，歐洲法院（CJEU）就纏訟多年的 Apple 愛爾蘭國家補助案做出終局判決，Apple 必須補繳約 130 億歐元的愛爾蘭稅款。Apple 在 FY2024 10-K 認列了約 USD 10.2B 的一次性所得稅費用，這就是 ETR 從 14.7% 跳到 24.1% 的原因。</p>\n\n  <p>對投資人的判讀重點：這是一次性項目，不是結構惡化。證據是 FY2025 ETR 回落到 15.6%。但 15.6% 相比疫情前年份的 13-14% 還是高了一到兩個百分點，這個差距就是下一段的主角。</p>\n\n  <h2>Pillar Two 之後的新常態</h2>\n\n  <p>OECD 主導的全球最低稅（Pillar Two / GloBE）要求大型跨國集團在每一個法域的有效稅率至少 15%，愛爾蘭也已經對大型集團引入 15% 的補充稅制。這代表 Apple 過去依賴「愛爾蘭低稅率」的那部分利益，正在被制度性地收回。</p>\n\n  <p>我的判讀：Apple 的結構性 ETR 區間已經從過去的 12-14% 上移到 15-16%，而且回不去了。用簡單的敏感度概念看，ETR 每上升 1 個百分點，稅前淨利不變的情況下淨利大約減少 1.2%（假設：稅前淨利與流通股數不變，僅為量級說明，非精確預測）。這不是災難等級的數字，但它是一個持續存在的估值輸入項，市場討論得不多。</p>\n\n  <h2>散戶可以帶走的三件事</h2>\n\n  <ol>\n    <li><strong>看 10-K 的所得稅附註，不要只看 EPS。</strong>ETR 的年度變動與組成，是淨利品質的領先指標。</li>\n    <li><strong>區分一次性與結構性。</strong>FY2024 的 24.1% 是一次性事件，FY2025 的 15.6% 才是新常態基準。</li>\n    <li><strong>把 Pillar Two 放進長期模型。</strong>所有高度依賴低稅法域配置利潤的跨國公司，2026-2030 都在經歷同一個 ETR 上移過程，Apple 只是最顯眼的例子。</li>\n  </ol>\n\n  <div class=\"assumption\">本文假設與限制：文中敏感度計算為簡化說明，未考慮稅前淨利成長、庫藏股回購對 EPS 的影響、遞延稅項時間差異。State Aid 金額以 Apple 財報認列數為準，與媒體報導的歐元金額因匯率與利息計算而略有差異。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>美國股票蘋果(Apple/AAPL) 的有效稅率(Effective Tax Rate; ETR)是多少？</h3>\n  <p>依 Apple 10-K：FY2021 是 13.3%、FY2022 是 16.2%、FY2023 是 14.7%、FY2024 升到 24.1%（含歐盟 State Aid 一次性補稅約 USD 10.2B）、FY2025 降到 15.6%。</p>\n\n  <h3>為什麼 Apple 多年繳得比美國法定稅率 21% 低？</h3>\n  <p>四個結構性因素：關鍵智財的經濟利益長年配置在愛爾蘭子公司（傳統稅率 12.5%）、GILTI 與 FDII 互抵淨效果仍低於 21%、研發稅額抵減（IRC §41）每年穩定貢獻 1 到 2 個百分點、股份薪酬的稅務超額利益再貢獻零點幾個百分點。</p>\n\n  <h3>FY2024 的 ETR 為什麼突然上升到 24.1%？</h3>\n  <p>2024 年 9 月歐洲法院（CJEU）就 Apple 愛爾蘭國家補助案做出判決，Apple 須補繳約 130 億歐元稅款，並在 FY2024 10-K 認列約 USD 10.2B 的一次性所得稅費用。這是一次性項目而非結構惡化，後續 FY2025 ETR 降至 15.6%。</p>\n\n  <h3>全球最低稅負（OECD Pillar Two）對 Apple (AAPL)的ETR有什麼影響？</h3>\n  <p>Pillar Two 要求大型跨國集團在每個租稅管轄區的有效稅率至少 15%，愛爾蘭已對大型集團導入 15% 最低稅負制。筆者的判讀是：Apple 的結構性 ETR 區間已從過去的 12% 到 14% 上移到 15% 到 16%，且回不去了；ETR 每上升 1 個百分點，稅前淨利不變下，淨利約減少 1.2%（其他條件不變下）。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20apple-etr\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0000320193&amp;type=10-K\" target=\"_blank\" rel=\"noopener\">Apple Inc. Form 10-K, FY2024 及 FY2025<span class=\"sr-only\">（於新分頁開啟）</span></a>（SEC EDGAR，FY2025 於 2025-10 申報），所得稅附註</li>\n      <li><a href=\"https://curia.europa.eu/juris/document/document.jsf?docid=289923&amp;doclang=EN\" target=\"_blank\" rel=\"noopener\">CJEU Case C-465/20 P<span class=\"sr-only\">（於新分頁開啟）</span></a>（Apple / Ireland State Aid，2024-09 判決）</li>\n      <li>OECD, <a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-digitalisation-of-the-economy-global-anti-base-erosion-model-rules-pillar-two_782bac33-en.html\" target=\"_blank\" rel=\"noopener\">GloBE Model Rules<span class=\"sr-only\">（於新分頁開啟）</span></a> 及 <a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-the-digitalisation-of-the-economy-commentary-to-the-global-anti-base-erosion-model-rules-pillar-two-first-edition_1e0e9cd8-en.html\" target=\"_blank\" rel=\"noopener\">Commentary<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li>數據查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"ai-research-workflow.html\">我如何用 AI 打造投資研究流程：從財報到結論的自動化管線</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成投資建議或稅務專業意見。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>Apple 過去五年的有效稅率（Effective Tax Rate, ETR）依序是 13.3%、16.2%、14.7%，FY2024 跳到 24.1%，FY2025 又回到 15.6%。美國聯邦法定稅率是 21%，故一家公司多年繳得比法定低 5 到 8 個百分點，某一年又突然比法定高 3 個百分點，每一個數字背後都有對應得到的結構因素，而非市場情緒能解釋的波動。</p>\n\n  <p>看懂 ETR 的組成與一次性項目，你對 Apple 淨利品質的判斷會比只看 EPS 的人深一層：平常年份為何能把 21% 壓到 13% 至 16%，以及 FY2024 那個 24.1% 從何而來。</p>\n\n  <h2>先看數字</h2>\n\n  <table>\n    <tr><th>會計年度</th><th>所得稅費用</th><th>有效稅率 (ETR)</th><th>備註</th></tr>\n    <tr><td>FY2021</td><td>USD 14.5B</td><td>13.3%</td><td></td></tr>\n    <tr><td>FY2022</td><td>USD 19.3B</td><td>16.2%</td><td></td></tr>\n    <tr><td>FY2023</td><td>USD 16.7B</td><td>14.7%</td><td></td></tr>\n    <tr><td>FY2024</td><td>USD 29.7B</td><td>24.1%</td><td>含歐盟 State Aid 一次性補稅約 USD 10.2B</td></tr>\n    <tr><td>FY2025</td><td>USD 20.7B</td><td>15.6%</td><td>回歸結構性區間</td></tr>\n  </table>\n\n  <p>ETR 的公式是所得稅費用除以稅前淨利，算不難，難的是解讀。雖公式本身只有一層除法，但由於分子含一次性補稅、分母含稅前結構變化，故同一條 ETR 曲線必須拆成「結構性區間」與「一次性衝擊」兩段來看，否則 FY2024 會被誤讀成稅負惡化。</p>\n\n  <h2>四個結構性因素：21% 如何變成 13% 至 16%</h2>\n\n  <h3>海外營運效果</h3>\n  <p>Apple 全球銷售，惟關鍵智慧財產（iOS、晶片設計、品牌）的經濟利益長年配置在愛爾蘭子公司。愛爾蘭傳統公司稅率 12.5%，低於美國的 21%，海外利潤適用較低稅率，直接把整體 ETR 往下拉。這是合法的稅制差異利用（亦即利用各國法定稅率不同，而非隱匿所得），10-K 所得稅附註裡「Foreign income taxed at rates lower than the U.S. statutory rate」那一行就是它，也是四項裡影響最大的一項。</p>\n\n  <h3>GILTI 與 FDII</h3>\n  <p>2017 年美國稅改（TCJA）之後，GILTI 制度強制把海外受控公司的無形資產所得拉回美國課稅，方向是把 ETR 往上推；FDII 則給美國公司用美國智財賺取的海外所得優惠稅率，方向是往下拉。Apple 兩者都適用，淨效果仍然低於 21%（因為海外低稅利益未被 GILTI 全部吃掉，非兩項互相抵銷為零）。</p>\n\n  <h3>研發稅額抵減（R&D Tax Credit）</h3>\n  <p>美國 IRC §41 給合格研發支出稅額抵減。這是 credit 不是 deduction：一塊錢抵一塊錢的稅，不是抵課稅所得。以 Apple 每年數百億美元等級的研發支出，這項每年穩定貢獻 1 到 2 個百分點的 ETR 下降。</p>\n\n  <h3>股份基礎給酬的稅務超額利益</h3>\n  <p>會計上，股票薪酬（SBC）按授與日公允價值認列費用；稅務上按員工實際 vest 或行使時的價值抵稅。股價長期上漲的公司，稅上抵減金額大於帳上費用，產生所謂 windfall benefit，再貢獻零點幾個百分點。</p>\n\n  <h2>FY2024 的 24.1%：歐盟 State Aid 補稅</h2>\n\n  <p>2024 年 9 月，歐洲法院（CJEU）就纏訟多年的 Apple 愛爾蘭國家補助案做出終局判決，Apple 必須補繳約 130 億歐元的愛爾蘭稅款。Apple 在 FY2024 10-K 認列了約 USD 10.2B 的一次性所得稅費用，這就是 ETR 從 14.7% 跳到 24.1% 的原因。</p>\n\n  <p>對投資人的判讀重點：這是一次性項目，不是結構惡化。若結構真的惡化，FY2025 為何立刻回到 15.6%？證據指向一次性項目，而非稅負結構翻轉。然 15.6% 相比疫情前年份的 13% 至 14% 仍高了一到兩個百分點，這個差距才是下一段要處理的結構位移，而非 FY2024 那筆補稅本身。</p>\n\n  <h2>Pillar Two 之後的新常態</h2>\n\n  <p>OECD 主導的全球最低稅（Pillar Two / GloBE）要求大型跨國集團在每一個法域的有效稅率至少 15%，愛爾蘭也已經對大型集團引入 15% 的補充稅制。這代表 Apple 過去依賴愛爾蘭低稅率的那部分利益，正在被制度性地收回。</p>\n\n  <p>惟筆者以為，Apple 的結構性 ETR 區間已經從過去的 12% 至 14% 上移到 15% 至 16%，而且回不去了。用敏感度概念看，ETR 每上升 1 個百分點，稅前淨利不變的情況下淨利大約減少 1.2%（假設：稅前淨利與流通股數不變，僅為量級說明，非精確預測）。</p>\n\n  <p>此亦可由另一角度分析：稅前淨利若為 100，ETR 15% 時稅後 85，ETR 16% 時稅後 84，差額 1 除以原稅後 85，約 1.18%，與前述 1.2% 同量級。故這不是足以改寫投資論述的衝擊，但它是一個持續存在的估值輸入項，市場討論得不多。</p>\n\n  <h2>小結</h2>\n\n  <ol>\n    <li>看 10-K 的所得稅附註，不要只看 EPS。ETR 的年度變動與組成，是淨利品質的領先指標。</li>\n    <li>區分一次性與結構性：FY2024 的 24.1% 是一次性事件，FY2025 的 15.6% 才是新常態基準。</li>\n    <li>把 Pillar Two 放進長期模型。所有高度依賴低稅法域配置利潤的跨國公司，2026 年至 2030 都在經歷同一個 ETR 上移過程，Apple 只是最顯眼的例子。</li>\n  </ol>\n\n  <div class=\"assumption\">本文假設與限制：文中敏感度計算為簡化說明，未考慮稅前淨利成長、庫藏股回購對 EPS 的影響、遞延稅項時間差異。State Aid 金額以 Apple 財報認列數為準，與媒體報導的歐元金額因匯率與利息計算而略有差異。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>美國股票蘋果(Apple/AAPL) 的有效稅率(Effective Tax Rate; ETR)是多少？</h3>\n  <p>依 Apple 10-K：FY2021 是 13.3%、FY2022 是 16.2%、FY2023 是 14.7%、FY2024 升到 24.1%（含歐盟 State Aid 一次性補稅約 USD 10.2B）、FY2025 降到 15.6%。</p>\n\n  <h3>為什麼 Apple 多年繳得比美國法定稅率 21% 低？</h3>\n  <p>四個結構性因素：關鍵智財的經濟利益長年配置在愛爾蘭子公司（傳統稅率 12.5%）、GILTI 與 FDII 互抵淨效果仍低於 21%、研發稅額抵減（IRC §41）每年穩定貢獻 1 到 2 個百分點、股份薪酬的稅務超額利益再貢獻零點幾個百分點。</p>\n\n  <h3>FY2024 的 ETR 為什麼突然上升到 24.1%？</h3>\n  <p>2024 年 9 月歐洲法院（CJEU）就 Apple 愛爾蘭國家補助案做出判決，Apple 須補繳約 130 億歐元稅款，並在 FY2024 10-K 認列約 USD 10.2B 的一次性所得稅費用。這是一次性項目而非結構惡化，後續 FY2025 ETR 降至 15.6%。</p>\n\n  <h3>全球最低稅負（OECD Pillar Two）對 Apple (AAPL)的ETR有什麼影響？</h3>\n  <p>Pillar Two 要求大型跨國集團在每個租稅管轄區的有效稅率至少 15%，愛爾蘭已對大型集團導入 15% 最低稅負制。筆者的判讀是：Apple 的結構性 ETR 區間已從過去的 12% 到 14% 上移到 15% 到 16%，且回不去了；ETR 每上升 1 個百分點，稅前淨利不變下，淨利約減少 1.2%（其他條件不變下）。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20apple-etr\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0000320193&amp;type=10-K\" target=\"_blank\" rel=\"noopener\">Apple Inc. Form 10-K, FY2024 及 FY2025<span class=\"sr-only\">（於新分頁開啟）</span></a>（SEC EDGAR，FY2025 於 2025-10 申報），所得稅附註</li>\n      <li><a href=\"https://curia.europa.eu/juris/document/document.jsf?docid=289923&amp;doclang=EN\" target=\"_blank\" rel=\"noopener\">CJEU Case C-465/20 P<span class=\"sr-only\">（於新分頁開啟）</span></a>（Apple / Ireland State Aid，2024-09 判決）</li>\n      <li>OECD, <a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-digitalisation-of-the-economy-global-anti-base-erosion-model-rules-pillar-two_782bac33-en.html\" target=\"_blank\" rel=\"noopener\">GloBE Model Rules<span class=\"sr-only\">（於新分頁開啟）</span></a> 及 <a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-the-digitalisation-of-the-economy-commentary-to-the-global-anti-base-erosion-model-rules-pillar-two-first-edition_1e0e9cd8-en.html\" target=\"_blank\" rel=\"noopener\">Commentary<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li>數據查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"ai-research-workflow.html\">我如何用 AI 做投資研究：從財報到結論</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成投資建議或稅務專業意見。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "title_suggested": "TSM ADR 與台股 2330：股利稅與美國遺產稅如何判斷",
      "description_original": "TSM ADR 股利被扣 21% 拿不拿得回來？TSM ADR 算不算美國遺產稅資產？用發行人測試一次講清楚。",
      "description_suggested": "TSM ADR 股利被扣 21%，實務上難以回台灣抵稅；美國遺產稅則看發行人註冊地，不看掛牌地。先做發行人測試。",
      "issues": [
        "開場「這篇用稅務專業的分析框架講清楚」屬 signposting",
        "「白話講：」podcast 引導語",
        "「錯。」短句獨立成段，金句節奏",
        "「常見錯誤一／二」排比小標",

      "body_original": "<p>很多台灣投資人同時看得到兩個台積電：台股的 2330 和紐約的 TSM ADR。同一家公司，兩種持有形式，稅務待遇差很多，而且網路上流傳的說法有兩個常見錯誤。這篇用稅務專業的分析框架講清楚。</p>\n\n  <h2>先建立一個判斷工具：發行人測試</h2>\n\n  <p>跨境證券稅務問題，第一步永遠是問：<strong>這個證券的發行人是誰、註冊在哪裡</strong>。不是問掛牌地，不是問你的券商在哪，是問發行人。</p>\n\n  <p>TSM ADR 在紐約證交所掛牌，但它代表的標的是台積電（台灣註冊公司）的股票。發行人是台灣公司，這個事實決定了後面所有稅務結論。</p>\n\n  <h2>常見錯誤一：「TSM 在美國掛牌，所以要繳美國遺產稅」</h2>\n\n  <p>錯。美國遺產稅對外國人只課美國境內資產（US-situs assets），而股票的 situs 判斷依據是發行公司的註冊地（IRC §2104）：美國公司股票是 US-situs，外國公司股票不是。ADR 代表的是外國公司股票，一般見解下，外國發行人的 ADR 不屬於 US-situs 資產。</p>\n\n  <p>所以同樣放在美國券商帳戶裡，AAPL 要計入美國遺產稅、TSM ADR 一般見解下不用。掛牌地在紐約這件事，不改變發行人是台灣公司的事實。</p>\n\n  <div class=\"callout\">順帶一提，這個「發行人測試」在台灣端也成立：TSM ADR 的標的發行人是境內公司台積電，這是它與 KY 股（境外發行人來台掛牌）在台灣稅務上被區別對待的原因。同一個分析工具，兩邊都用得上。</div>\n\n  <h2>常見錯誤二：「ADR 跟台股領股利一樣，只是換個地方領」</h2>\n\n  <p>差很多。台積電發股利時，兩種持有人的現金流路徑完全不同：</p>\n\n  <table>\n    <tr><th>項目</th><th>台股 2330（台灣居民直接持有）</th><th>TSM ADR（透過美國券商持有）</th></tr>\n    <tr><td>股利發放路徑</td><td>台積電 → 你</td><td>台積電 → 存託機構 → 券商 → 你</td></tr>\n    <tr><td>台灣端稅務</td><td>併入綜合所得（可用 8.5% 可抵減稅額，上限 8 萬）或 28% 分開計稅，二擇一</td><td>存託機構為非居住者，股利匯出時按非居住者稅率扣繳 21%</td></tr>\n    <tr><td>美國端稅務</td><td>無</td><td>股利非美國來源，無美國預扣稅</td></tr>\n    <tr><td>台灣居民後續申報</td><td>如上，擇優適用</td><td>實務上難以直接適用境內股利的抵減機制，21% 扣繳通常成為實質稅負</td></tr>\n  </table>\n\n  <p>白話講：透過 ADR 領台積電股利，你的股利先被當成「發給外國存託機構」扣 21%，而你身為台灣居民本來可以選的股利課稅優惠（尤其低所得級距者用 8.5% 抵減可能實質免稅），在 ADR 路徑下實務上用不到。對股利殖利率敏感的長期持有人，這個差異每年都在發生。</p>\n\n  <h3>那為什麼還有人持有 TSM ADR？</h3>\n  <ul>\n    <li>資金已在美元體系，不想做台美資金搬運</li>\n    <li>美元計價、美股交易時段、與其他美股部位統一管理</li>\n    <li>部分機構或策略只能買美國掛牌證券</li>\n  </ul>\n  <p>這些都是正當理由。重點是決策時要把「股利稅務成本較高」這個因素放進去，而不是誤以為兩邊一樣。</p>\n\n  <h2>結論</h2>\n  <ol>\n    <li>遺產稅：TSM ADR 一般見解下非 US-situs，不計入美國遺產稅。網路上「所有美股帳戶資產都要繳美國遺產稅」的說法對 ADR 不精確。</li>\n    <li>股利稅：ADR 路徑實質稅負通常是 21% 扣繳；台股路徑可擇優適用境內股利課稅機制。高股息持有人差異顯著。</li>\n    <li>方法論：遇到跨境證券稅務問題，先做發行人測試，再查掛牌地與帳戶地的影響，順序不能反。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人、透過美國券商持有 TSM ADR 的一般情境為準。存託機構實務作業、健保補充保費、海外所得基本稅額（個人 AMT）等因素依個人情況而異。situs 認定在特殊事實下可能有不同見解，大部位持有人請個案諮詢。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>台積電TSM ADR 需要繳美國遺產稅嗎？</h3>\n  <p>一般見解不用。美國遺產稅對外國人只課美國境內資產（US-situs），股票的 situs 依發行公司註冊地判斷（IRC §2104）。TSM ADR 代表的是台積電（台灣註冊公司）的股票，發行人是台灣公司，所以一般見解認為不屬於 US-situs 資產。其他美國註冊公司股票，例如：蘋果 AAPL 則要計入。</p>\n\n  <h3>台積電TSM ADR 的股利會被扣多少稅？</h3>\n  <p>台積電發放股利給美國ADR存託機構時，因存託機構是台灣稅法上的非居住者，按 21% 扣繳。美國端沒有預扣稅（股利非美國來源所得），但台灣居民實務上較難主張把這筆扣繳稅款回台灣抵稅，21%通常就是這筆股利所得的最終稅務成本。</p>\n\n  <h3>領台積電TSM(TSMC)股利，2330 和 TSM ADR 差在哪？</h3>\n  <p>2330 可二擇一：併入綜合所得（8.5% 可抵減稅額、上限 8 萬）或 28% 分開計稅；低所得級距者用 8.5% 抵減可能實質免稅。ADR 則是就源扣繳 21%。偏好股息收益的投資人，投資台積電股票v. 投資TSM ADR值得進一步思考長期投資的稅後股息報酬差異。</p>\n\n  <h3>如何判斷一檔美國掛牌股票的稅務成本差異？</h3>\n  <p>先做發行人測試：先看發行公司註冊在哪裡，不看掛牌交易市場、也不看券商在哪裡。發行人所在國決定遺產稅 situs 與股利來源（例如：TSM ADR 與 KY 股）。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20tsm-adr-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股票 situs 以發行公司為準）、<a href=\"https://www.law.cornell.edu/cfr/text/26/20.2104-1\" target=\"_blank\" rel=\"noopener\">Treas. Reg. §20.2104-1<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003\" target=\"_blank\" rel=\"noopener\">台灣所得稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（居住者股利所得課稅：合併計稅可抵減 / 28% 分開計稅）、非居住者扣繳率規定</li>\n      <li>台積電投資人關係網站（ADR 架構與存託機構說明）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"sk-hynix-adr-tax.html\">SK 海力士要來美股了：台灣人該買 ADR 還是買韓股？</a></li>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>TSM ADR 一般見解下不計入美國遺產稅（因為發行人是台灣公司，非美國公司），然股利路徑的實質稅負通常是 21% 就源扣繳，與台股 2330 可擇優適用境內股利機制（8.5% 可抵減稅額、上限 8 萬，或 28% 分開計稅）並不相同。網路上把掛牌地當成課稅依據、或把兩種持有形式當成同一筆股利，這兩件事都錯。</p>\n\n  <h2>先建立一個判斷工具：發行人測試</h2>\n\n  <p>跨境證券稅務問題，第一步永遠是問這個證券的發行人是誰、註冊在哪裡（亦即不看掛牌交易市場，亦不看券商所在地）。TSM ADR 雖在紐約證交所掛牌，但由於它代表的標的是台積電（台灣註冊公司）的股票，故發行人是台灣公司，這個事實決定了後面所有稅務結論。</p>\n\n  <h2>美國遺產稅：看發行人註冊地，不看掛牌地</h2>\n\n  <p>美國遺產稅對外國人只課美國境內資產（US-situs assets），而股票的 situs 判斷依據是發行公司的註冊地（IRC §2104）：美國公司股票是 US-situs，外國公司股票不是。ADR 代表的是外國公司股票，一般見解下，外國發行人的 ADR 不屬於 US-situs 資產。故同樣放在美國券商帳戶裡，AAPL 要計入美國遺產稅、TSM ADR 一般見解下不用；掛牌地在紐約這件事，不改變發行人是台灣公司的事實。爰此，不能用掛牌地或帳戶地取代發行人測試。</p>\n\n  <div class=\"callout\">順帶一提，這個「發行人測試」在台灣端也成立：TSM ADR 的標的發行人是境內公司台積電，這是它與 KY 股（境外發行人來台掛牌）在台灣稅務上被區別對待的原因。同一個分析工具，兩邊都用得上。</div>\n\n  <h2>股利稅：ADR 路徑與台股路徑並不相同</h2>\n\n  <p>台積電發股利時，兩種持有人的現金流路徑完全不同：</p>\n\n  <table>\n    <tr><th>項目</th><th>台股 2330（台灣居民直接持有）</th><th>TSM ADR（透過美國券商持有）</th></tr>\n    <tr><td>股利發放路徑</td><td>台積電 → 你</td><td>台積電 → 存託機構 → 券商 → 你</td></tr>\n    <tr><td>台灣端稅務</td><td>併入綜合所得（可用 8.5% 可抵減稅額，上限 8 萬）或 28% 分開計稅，二擇一</td><td>存託機構為非居住者，股利匯出時按非居住者稅率扣繳 21%</td></tr>\n    <tr><td>美國端稅務</td><td>無</td><td>股利非美國來源，無美國預扣稅</td></tr>\n    <tr><td>台灣居民後續申報</td><td>如上，擇優適用</td><td>實務上難以直接適用境內股利的抵減機制，21% 扣繳通常成為實質稅負</td></tr>\n  </table>\n\n  <p>換言之，透過 ADR 領台積電股利，你的股利先被當成「發給外國存託機構」扣 21%，而你身為台灣居民本來可以選的股利課稅優惠（尤其低所得級距者用 8.5% 抵減可能實質免稅），在 ADR 路徑下實務上用不到。對股利殖利率敏感的長期持有人，這個差異每年都在發生。</p>\n\n  <p>此亦可由另一角度分析：2330 的股利是境內所得，可走 8.5% 可抵減（上限 8 萬）或 28% 分開計稅；ADR 路徑下，扣繳義務發生在存託機構（亦即台灣稅法上的非居住者）收受股利之時，21% 已在源頭扣完，後續要主張回台灣抵減，實務上幾乎走不通。同一家公司、同一筆盈餘分配，持有形式不同，稅後現金流就不同。</p>\n\n  <h3>那為什麼還有人持有 TSM ADR？</h3>\n  <ul>\n    <li>資金已在美元體系，不想做台美資金搬運</li>\n    <li>美元計價、美股交易時段、與其他美股部位統一管理</li>\n    <li>部分機構或策略只能買美國掛牌證券</li>\n  </ul>\n  <p>這些都是正當理由。惟決策時要把「股利稅務成本較高」這個因素放進去，而不是誤以為兩邊一樣。</p>\n\n  <h2>結論</h2>\n  <ol>\n    <li>遺產稅：TSM ADR 一般見解下非 US-situs，不計入美國遺產稅。網路上「所有美股帳戶資產都要繳美國遺產稅」的說法對 ADR 不精確。</li>\n    <li>股利稅：ADR 路徑實質稅負通常是 21% 扣繳；台股路徑可擇優適用境內股利課稅機制。高股息持有人差異顯著。</li>\n    <li>方法論：遇到跨境證券稅務問題，先做發行人測試，再查掛牌地與帳戶地的影響，順序不能反。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人、透過美國券商持有 TSM ADR 的一般情境為準。存託機構實務作業、健保補充保費、海外所得基本稅額（個人 AMT）等因素依個人情況而異。situs 認定在特殊事實下可能有不同見解，大部位持有人請個案諮詢。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>台積電TSM ADR 需要繳美國遺產稅嗎？</h3>\n  <p>一般見解不用。美國遺產稅對外國人只課美國境內資產（US-situs），股票的 situs 依發行公司註冊地判斷（IRC §2104）。TSM ADR 代表的是台積電（台灣註冊公司）的股票，發行人是台灣公司，所以一般見解認為不屬於 US-situs 資產。其他美國註冊公司股票，例如：蘋果 AAPL 則要計入。</p>\n\n  <h3>台積電TSM ADR 的股利會被扣多少稅？</h3>\n  <p>台積電發放股利給美國ADR存託機構時，因存託機構是台灣稅法上的非居住者，按 21% 扣繳。美國端沒有預扣稅（股利非美國來源所得），但台灣居民實務上較難主張把這筆扣繳稅款回台灣抵稅，21%通常就是這筆股利所得的最終稅務成本。</p>\n\n  <h3>領台積電TSM(TSMC)股利，2330 和 TSM ADR 差在哪？</h3>\n  <p>2330 可二擇一：併入綜合所得（8.5% 可抵減稅額、上限 8 萬）或 28% 分開計稅；低所得級距者用 8.5% 抵減可能實質免稅。ADR 則是就源扣繳 21%。偏好股息收益的投資人，投資台積電股票v. 投資TSM ADR值得進一步思考長期投資的稅後股息報酬差異。</p>\n\n  <h3>如何判斷一檔美國掛牌股票的稅務成本差異？</h3>\n  <p>先做發行人測試：先看發行公司註冊在哪裡，不看掛牌交易市場、也不看券商在哪裡。發行人所在國決定遺產稅 situs 與股利來源（例如：TSM ADR 與 KY 股）。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20tsm-adr-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股票 situs 以發行公司為準）、<a href=\"https://www.law.cornell.edu/cfr/text/26/20.2104-1\" target=\"_blank\" rel=\"noopener\">Treas. Reg. §20.2104-1<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003\" target=\"_blank\" rel=\"noopener\">台灣所得稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（居住者股利所得課稅：合併計稅可抵減 / 28% 分開計稅）、非居住者扣繳率規定</li>\n      <li>台積電投資人關係網站（ADR 架構與存託機構說明）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"sk-hynix-adr-tax.html\">SK 海力士要來美股了：台灣人該買 ADR 還是買韓股？</a></li>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "body_original": "<p>「外國人投資美國公債免遺產稅」這句話本身是對的，但很多人把它解讀成「所以我買公債 ETF 也免遺產稅」，這就擴大解讀了，以下詳細說明。</p>\n\n  <h2>稅法規定</h2>\n\n  <p>外國人（非美國公民且非美國稅務居民）只需就美國境內資產繳美國遺產稅，免稅額實質上只有 USD 60,000（詳細計算見<a href=\"us-estate-tax-60k.html\">遺產稅完整解析</a>）。而法規給了幾類資產豁免或排除，其中最重要的一類：外國人直接持有的美國政府公債（T-Bill、T-Note、T-Bond），其利息符合 portfolio interest 豁免者，無須繳納美國遺產稅。</p>\n\n  <p>所以台灣投資人如果直接持有 USD 300,000 的美國公債，身故時這些美國公債完全不用繳美國遺產稅。</p>\n\n  <h2>為什麼 ETF 不一樣？</h2>\n\n  <p>邏輯：</p>\n  <ol>\n    <li>你買 VBIL、BIL、SGOV 這類美國掛牌公債 ETF，你持有的不是公債，是<strong>基金的股份</strong></li>\n    <li>這些 ETF 是美國註冊的投資公司（RIC）發行，發行人是美國實體</li>\n    <li>股票與基金股份的 situs 判斷看發行人註冊地：美國實體發行 = US-situs</li>\n    <li>因此這類型的公債 ETF 股份必須計入美國遺產稅課稅範圍，至於 ETF 持有的資產類型與要不要繳納遺產稅完全無關</li>\n  </ol>\n\n  <p>綜上：<strong>直接投資美國公債免遺產稅；投資美國掛牌的公債 ETF 要課遺產稅</strong>。標的資產都是美國公債，隔了一層美國基金 ETF，遺產稅待遇完全不同。</p>\n\n  <h2>對照表</h2>\n\n  <table>\n    <tr><th>持有形式</th><th>美國遺產稅</th><th>利息/配息的美國預扣稅</th><th>操作便利性</th></tr>\n    <tr><td>直接持有 T-Bill / T-Note</td><td>豁免</td><td>免（portfolio interest）</td><td>往來券商的交易平台需支援債券交易；最小交易面額與再投資需自行管理</td></tr>\n    <tr><td>美國掛牌公債 ETF（VBIL、BIL、SGOV 等）</td><td>計入美國遺產課稅（US-situs）</td><td>利息型配息多數情況可免（interest-related dividends），依基金申報而定</td><td>交易便利</td></tr>\n    <tr><td>愛爾蘭 UCITS 公債 ETF</td><td>非 US-situs，不計入美國遺產</td><td>基金適用美國愛爾蘭租稅協定</td><td>往來券商需支援歐股市場交易</td></tr>\n  </table>\n\n  <h2>實務評估</h2>\n\n  <ul>\n    <li><strong>投資部位小（美國資產合計低於 USD 60k）</strong>：優先考慮交易便利性，本來就課不到你。</li>\n    <li><strong>投資部位大、現金與債券配置比重高</strong>：把美國公債部位改成直接持有。</li>\n    <li><strong>已經有大量美股部位的人</strong>：公債直接持有的豁免額度等於幫你「騰出」US-situs 空間，資產配置與遺產稅規劃可以一次到位。</li>\n  </ul>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人投資者為準。ETF 配息的預扣稅處理依各基金年度申報的 interest-related dividend 比例而定，各家不同。貨幣市場基金、附買回結構等變形工具的認定另有細節。個案請諮詢合格稅務專業人員。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20treasury-etf-estate-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2105\" target=\"_blank\" rel=\"noopener\">IRC §2105(b)<span class=\"sr-only\">（於新分頁開啟）</span></a>（外國人遺產稅豁免資產，含符合 portfolio interest 之債務工具）</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股份 situs 以發行人為準）</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/871\" target=\"_blank\" rel=\"noopener\">IRC §871(k)<span class=\"sr-only\">（於新分頁開啟）</span></a>（interest-related dividends 預扣稅豁免）</li>\n      <li>法規查核日期：2026-07-10</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思，一次拆掉</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>外國人直接持有美國公債，利息符合 portfolio interest 豁免者無須繳納美國遺產稅，這句話本身是對的。然把這句話推成「公債 ETF 也免遺產稅」，是把底層資產與你持有的證券混為一談（因為你買的是美國註冊基金的股份，非公債本身）。</p>\n\n  <h2>稅法規定</h2>\n\n  <p>外國人（非美國公民且非美國稅務居民）只需就美國境內資產繳美國遺產稅，免稅額實質上只有 USD 60,000（詳細計算見<a href=\"us-estate-tax-60k.html\">遺產稅完整解析</a>）。而法規給了幾類資產豁免或排除，其中最重要的一類：外國人直接持有的美國政府公債（T-Bill、T-Note、T-Bond），其利息符合 portfolio interest 豁免者，無須繳納美國遺產稅。故台灣投資人如果直接持有 USD 300,000 的美國公債，身故時這些美國公債完全不用繳美國遺產稅。</p>\n\n  <h2>公債 ETF 持有的是基金股份，不是公債</h2>\n\n  <p>判斷框架如下：</p>\n  <ol>\n    <li>你買 VBIL、BIL、SGOV 這類美國掛牌公債 ETF，你持有的不是公債，是基金的股份</li>\n    <li>這些 ETF 是美國註冊的投資公司（RIC）發行，發行人是美國實體</li>\n    <li>股票與基金股份的 situs 判斷看發行人註冊地：美國實體發行即為 US-situs</li>\n    <li>因此這類型的公債 ETF 股份必須計入美國遺產稅課稅範圍，至於 ETF 持有的資產類型與要不要繳納遺產稅完全無關</li>\n  </ol>\n\n  <p>雖底層資產都是美國公債，但由於隔了一層美國註冊基金（亦即你持有的課稅客體是 RIC 股份，非公債本身），故遺產稅待遇與直接持有完全不同。隔了一層基金，待遇就不同，這只是包裝問題嗎？不是包裝問題，是課稅客體從公債變成美國公司股份，法律效果跟著變。</p>\n\n  <p>此亦可由另一角度分析：遺產稅看的是你持有的那張證券是什麼，不是底層資產是什麼。直接持有 T-Bill，你持有的是美國政府債務工具（符合 portfolio interest 者豁免）；持有 VBIL，你持有的是美國 RIC 的股份（IRC §2104(a) 以發行人為準，故為 US-situs）。底層都是公債，法律上的課稅客體完全不同。</p>\n\n  <h2>對照表</h2>\n\n  <table>\n    <tr><th>持有形式</th><th>美國遺產稅</th><th>利息/配息的美國預扣稅</th><th>操作便利性</th></tr>\n    <tr><td>直接持有 T-Bill / T-Note</td><td>豁免</td><td>免（portfolio interest）</td><td>往來券商的交易平台需支援債券交易；最小交易面額與再投資需自行管理</td></tr>\n    <tr><td>美國掛牌公債 ETF（VBIL、BIL、SGOV 等）</td><td>計入美國遺產課稅（US-situs）</td><td>利息型配息多數情況可免（interest-related dividends），依基金申報而定</td><td>交易便利</td></tr>\n    <tr><td>愛爾蘭 UCITS 公債 ETF</td><td>非 US-situs，不計入美國遺產</td><td>基金適用美國愛爾蘭租稅協定</td><td>往來券商需支援歐股市場交易</td></tr>\n  </table>\n\n  <h2>實務評估</h2>\n\n  <p>惟部位一旦大到會碰到 USD 60,000 門檻，直接持有與 ETF 的差異就不再只是便利性問題。爰此，部位大小不同，取捨也不同。</p>\n\n  <ul>\n    <li>投資部位小（美國資產合計低於 USD 60k）：優先考慮交易便利性，本來就課不到你。</li>\n    <li>投資部位大、現金與債券配置比重高：把美國公債部位改成直接持有。</li>\n    <li>已經有大量美股部位的人：公債直接持有的豁免，等於幫你騰出 US-situs 空間，資產配置與遺產稅規劃可以一併處理。</li>\n  </ul>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人投資者為準。ETF 配息的預扣稅處理依各基金年度申報的 interest-related dividend 比例而定，各家不同。貨幣市場基金、附買回結構等變形工具的認定另有細節。個案請諮詢合格稅務專業人員。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20treasury-etf-estate-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2105\" target=\"_blank\" rel=\"noopener\">IRC §2105(b)<span class=\"sr-only\">（於新分頁開啟）</span></a>（外國人遺產稅豁免資產，含符合 portfolio interest 之債務工具）</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股份 situs 以發行人為準）</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/871\" target=\"_blank\" rel=\"noopener\">IRC §871(k)<span class=\"sr-only\">（於新分頁開啟）</span></a>（interest-related dividends 預扣稅豁免）</li>\n      <li>法規查核日期：2026-07-10</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "body_original": "<p>想知道 Buffett 上季加碼了什麼、Burry 又重壓了什麼，多數人用 Whalewisdom（年繳 USD 300，折合月費 USD 25）或免費但更新慢的 Dataroma。其實這些網站的資料源都是同一個：SEC EDGAR，公開、免費、有 API。這篇教你直接從源頭抓，順便講清楚 13F 這個數據的正確用法與限制。</p>\n\n  <h2>13F 是什麼</h2>\n\n  <ul>\n    <li><strong>誰要申報</strong>：管理美股部位達 USD 100M 的機構投資人（以任一月份最後交易日市值計，達標即須申報）</li>\n    <li><strong>報什麼</strong>：多頭部位，含買進的 put/call 選擇權（表上會標 PUT 或 CALL）；空頭部位看不到</li>\n    <li><strong>頻率</strong>：每季，季末後 45 天內申報</li>\n    <li><strong>格式</strong>：XML，機器可讀，這就是自動化的機會</li>\n  </ul>\n\n  <h2>先講限制，再講方法</h2>\n\n  <p>13F 有三個結構性限制，必須先搞懂：</p>\n  <ol>\n    <li><strong>45 天延遲</strong>：你看到的是季末的部位，機構現在可能已經反向操作。</li>\n    <li><strong>沒有空頭</strong>：對沖基金常做多做空配對交易，空頭那一隻腳 13F 上看不到，只看多頭會誤判方向。反倒是買進的 put 看得到（會標 PUT），Burry 那些出名的看空部位，市場就是從 13F 的 PUT 欄位讀出來的。</li>\n    <li><strong>部位規模語意不同</strong>：USD 10M 對 Berkshire 是小錢，對小型基金是重押。看變動比看存量有意義，看佔組合比重比看金額有意義。</li>\n  </ol>\n\n  <h2>核心流程：四步驟</h2>\n\n  <h3>Step 1：用 CIK 抓機構的申報清單</h3>\n  <p>每個申報機構有一個 CIK 編號（Berkshire 是 0001067983）。SEC 的 submissions API 一次回傳該機構所有申報紀錄：</p>\n  <pre><code>import requests\n\nHEADERS = {\"User-Agent\": \"YourName your@email.com\"}  # SEC 強制要求\nCIK = \"0001067983\"  # Berkshire Hathaway\n\nurl = f\"https://data.sec.gov/submissions/CIK{CIK}.json\"\ndata = requests.get(url, headers=HEADERS).json()\n\nfilings = data[\"filings\"][\"recent\"]\nidx = [i for i, f in enumerate(filings[\"form\"]) if f == \"13F-HR\"]</code></pre>\n\n  <h3>Step 2：解析 13F 的 XML 持股表</h3>\n  <pre><code>import xml.etree.ElementTree as ET\n\nns = {\"ns\": \"http://www.sec.gov/edgar/document/thirteenf/informationtable\"}\nroot = ET.fromstring(xml_text)\n\npositions = []\nfor it in root.findall(\".//ns:infoTable\", ns):\n    positions.append({\n        \"name\":  it.find(\"ns:nameOfIssuer\", ns).text,\n        \"cusip\": it.find(\"ns:cusip\", ns).text,\n        \"value\": int(it.find(\"ns:value\", ns).text),\n        \"shares\": int(it.find(\"ns:shrsOrPrnAmt/ns:sshPrnamt\", ns).text),\n    })</code></pre>\n\n  <h3>Step 3：CUSIP 轉 Ticker</h3>\n  <p>13F 用 CUSIP 識別證券，不是 ticker。維護一份對照表（或用 SEC 的 company_tickers.json 輔助），常見大型股一次建好就能重複用。</p>\n\n  <h3>Step 4：季度差異比對</h3>\n  <p>把本季與上季的持股表以 CUSIP 對齊，算出股數變化，就得到「加碼 / 減碼 / 新建倉 / 清倉」四類訊號，依變動金額排序輸出。</p>\n\n  <h2>新手最常踩的四個地雷</h2>\n\n  <table>\n    <tr><th>地雷</th><th>後果</th><th>解法</th></tr>\n    <tr><td>沒設 User-Agent</td><td>直接被 SEC 拒絕</td><td>Header 填「姓名 + email」</td></tr>\n    <tr><td>請求太快</td><td>超過 10 req/sec 會被暫時封鎖（SEC 官方說法是 brief period，降回限速以下才恢復）</td><td>加 rate limiting，睡 0.15 秒再抓下一筆</td></tr>\n    <tr><td>value 單位搞錯</td><td>2023 年前申報以千美元為單位，之後改為美元。跨年度比對時混用，數字差一千倍</td><td>依申報期間判斷單位再正規化</td></tr>\n    <tr><td>只比對最新兩季</td><td>錯過建倉趨勢（連續三季加碼比單季加碼訊號強）</td><td>至少保留四到八季的歷史</td></tr>\n  </table>\n\n  <h2>自動化排程</h2>\n\n  <p>13F 集中在季末後第 40 到 45 天湧入。我的做法：Windows 工作排程器每週跑一次腳本，申報高峰期改每日；輸出寫入 Excel，變動超過門檻時寄 email 通知自己。整套系統的變動成本是零，唯一的投資是第一次搭建的幾個小時。</p>\n\n  <p>再往上一層的玩法，是把 13F 訊號接進 AI 研究流程：偵測到兩個以上追蹤對象同季加碼同一檔股票時，自動觸發該公司的財報深讀。這部分的作法寫在<a href=\"ai-research-workflow.html\">AI 研究流程</a>那篇。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20diy-13f-tracker\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.sec.gov/edgar/search/\" target=\"_blank\" rel=\"noopener\">SEC EDGAR full-text search<span class=\"sr-only\">（於新分頁開啟）</span></a> 與 submissions API（data.sec.gov）</li>\n      <li><a href=\"https://www.sec.gov/rules-regulations/staff-guidance/division-investment-management-frequently-asked-questions/frequently-asked-questions-about-form-13f\" target=\"_blank\" rel=\"noopener\">SEC Form 13F 官方說明<span class=\"sr-only\">（於新分頁開啟）</span></a>與 XML technical specification</li>\n      <li>程式碼為作者實際使用版本之簡化，Python 3.13 測試通過</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"ai-research-workflow.html\">我如何用 AI 打造投資研究流程：從財報到結論的自動化管線</a></li>\n      <li><a href=\"apple-etr.html\">Apple 的稅務密碼：ETR 從 14.7% 飆到 24.1%，再回到 15.6%，發生了什麼事</a></li>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質。13F 數據有最長 45 天延遲且僅含多頭部位，不構成投資建議，不建議直接照抄機構持股操作。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",

t(it.find(\"ns:shrsOrPrnAmt/ns:sshPrnamt\", ns).text),\n    })</code></pre>\n\n  <h3>Step 3：CUSIP 轉 Ticker</h3>\n  <p>13F 用 CUSIP 識別證券，不是 ticker。維護一份對照表（或用 SEC 的 company_tickers.json 輔助），常見大型股一次建好就能重複用。</p>\n\n  <h3>Step 4：季度差異比對</h3>\n  <p>把本季與上季的持股表以 CUSIP 對齊，算出股數變化，就得到加碼、減碼、新建倉、清倉四類訊號，依變動金額排序輸出。爰此，自動化的價值不在「看到名人買了什麼」，而在把四類變動變成可排序、可設門檻的研究輸入。</p>\n\n  <h2>新手最常搞錯的四件事</h2>\n\n  <table>\n    <tr><th>地雷</th><th>後果</th><th>解法</th></tr>\n    <tr><td>沒設 User-Agent</td><td>直接被 SEC 拒絕</td><td>Header 填「姓名 + email」</td></tr>\n    <tr><td>請求太快</td><td>超過 10 req/sec 會被暫時封鎖（SEC 官方說法是 brief period，降回限速以下才恢復）</td><td>加 rate limiting，睡 0.15 秒再抓下一筆</td></tr>\n    <tr><td>value 單位搞錯</td><td>2023 年前申報以千美元為單位，之後改為美元。跨年度比對時混用，數字差一千倍</td><td>依申報期間判斷單位再正規化</td></tr>\n    <tr><td>只比對最新兩季</td><td>錯過建倉趨勢（連續三季加碼比單季加碼訊號強）</td><td>至少保留四到八季的歷史</td></tr>\n  </table>\n\n  <h2>自動化排程</h2>\n\n  <p>13F 集中在季末後第 40 到 45 天湧入。我的做法是 Windows 工作排程器每週跑一次腳本，申報高峰期改每日；輸出寫入 Excel，變動超過門檻時寄 email 通知自己。整套系統的變動成本是零，唯一的投資是第一次搭建的幾個小時。</p>\n\n  <p>再往上一層，是把 13F 訊號接進 AI 研究流程：偵測到兩個以上追蹤對象同季加碼同一檔股票時，自動觸發該公司的財報深讀。這部分的作法寫在<a href=\"ai-research-workflow.html\">AI 研究流程</a>那篇。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20diy-13f-tracker\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.sec.gov/edgar/search/\" target=\"_blank\" rel=\"noopener\">SEC EDGAR full-text search<span class=\"sr-only\">（於新分頁開啟）</span></a> 與 submissions API（data.sec.gov）</li>\n      <li><a href=\"https://www.sec.gov/rules-regulations/staff-guidance/division-investment-management-frequently-asked-questions/frequently-asked-questions-about-form-13f\" target=\"_blank\" rel=\"noopener\">SEC Form 13F 官方說明<span class=\"sr-only\">（於新分頁開啟）</span></a>與 XML technical specification</li>\n      <li>程式碼為作者實際使用版本之簡化，Python 3.13 測試通過</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4       "body_original": "<p>一個人做投資研究，時間永遠不夠：財報幾百頁、法說會逐字稿、13F 申報、新聞流。過去兩年我把整個研究流程重構成一條「人管判斷、機器管重複」的管線。這篇公開整套架構，以及比工具更重要的東西：防止 AI 幻覺的驗證守則。</p>\n\n  <h2>整體架構：五個階段</h2>\n\n  <table>\n    <tr><th>階段</th><th>做什麼</th><th>工具</th><th>人的角色</th></tr>\n    <tr><td>1. 數據擷取</td><td>股價、財務數據、13F、財報原文</td><td>Python（yfinance、SEC EDGAR API）</td><td>設定追蹤清單</td></tr>\n    <tr><td>2. 文件深讀</td><td>10-K、法說會逐字稿、產業報告的重點萃取與問答</td><td>AI 筆記工具（來源綁定式問答）</td><td>設計提問、驗證引用</td></tr>\n    <tr><td>3. 交叉驗證</td><td>關鍵數字對原始來源逐項核對</td><td>驗證清單 + 多來源比對</td><td>最終把關（不可外包給 AI）</td></tr>\n    <tr><td>4. 綜合分析</td><td>把數據、稅務視角、產業判斷整合成結論</td><td>AI 輔助草擬</td><td>判斷與定調（核心價值所在）</td></tr>\n    <tr><td>5. 產出與追蹤</td><td>分析報告、追蹤儀表板、定期更新排程</td><td>自動化腳本 + 排程器</td><td>覆核後發布</td></tr>\n  </table>\n\n  <p>原則很簡單：AI 負責量，人負責質。任何直接影響結論的數字，最後一關一定是人對原始來源。</p>\n\n  <h2>階段一：數據層自動化</h2>\n\n  <p>基礎是兩條 Python 管線。第一條抓市場與財務數據（yfinance 可以覆蓋大部分需求），第二條抓 SEC EDGAR 的原始申報（13F 追蹤的做法我寫在<a href=\"diy-13f-tracker.html\">這篇</a>）。兩條管線都掛在排程器上定期自動跑，輸出統一格式，後面所有分析引用同一份數據源，避免同一個數字在不同文件裡出現不同版本。</p>\n\n  <h2>階段二：AI 深讀，但要「來源綁定」</h2>\n\n  <p>讀 10-K 我用來源綁定式的 AI 問答工具：把財報 PDF 餵進去，AI 只能根據上傳的文件回答，每個回答附引用位置。這與開放式聊天機器人的差別是本質性的：後者會用訓練記憶補洞，補出來的數字看起來煞有其事，實際上可能是三年前的、甚至是編的。</p>\n\n  <p>提問設計也有方法：與其問「這家公司財務狀況如何」，不如拆成有明確答案的問題鏈：「本年度有效稅率多少、與去年差異的主因是什麼、管理層對明年稅率的指引是什麼」。問題越可驗證，AI 產出的可靠度越高。</p>\n\n  <h2>階段三：防幻覺守則（整套流程的靈魂）</h2>\n\n  <p>我在實務中吃過的虧、看過的坑，濃縮成四條鐵則：</p>\n\n  <ol>\n    <li><strong>價格與市值永遠即時多來源驗證。</strong>AI 記憶中的股價一律視為過期。任何進報告的價格，至少兩個獨立即時來源交叉核對。</li>\n    <li><strong>任何 YoY、成長率，分子分母都要對原始來源。</strong>AI 最容易在「變化率」上出錯：期間對不齊、口徑混用。驗證時要求列出計算式與兩端數字的出處。</li>\n    <li><strong>引用頁碼必須回原文核對。</strong>AI 給的「第 24 頁」可能整份文件只有 5 頁。引用驗證不過，整段結論重做。</li>\n    <li><strong>發現一個錯，全面掃描同類錯。</strong>幻覺不是單點事件。一個數字錯了，代表同一批產出裡可能還有同源的錯，要整批重驗，不能改完一處就當沒事。</li>\n  </ol>\n\n  <div class=\"callout\">這四條的共同邏輯：AI 的產出是「初稿」，驗證是獨立的流程步驟，而且驗證用的來源必須獨立於 AI 本身。讓 AI 自己檢查自己，等於沒有檢查。</div>\n\n  <h2>階段四與五：人做判斷，機器做維護</h2>\n\n  <p>驗證過的數據與深讀筆記進到綜合分析階段，AI 幫我草擬結構、列反方論點，但買賣判斷、部位權重、風險容忍這些決策不外包。產出後的追蹤靠排程自動化：財報季自動抓新 10-Q 觸發更新、13F 申報季自動比對持股變動、價格異動超過門檻自動提醒。</p>\n\n  <h2>想自己搭一套的人，從哪裡開始</h2>\n\n  <ol>\n    <li>先自動化最痛的一件事（多數人是「定期抓數據貼表格」），一條 yfinance 腳本就有感。</li>\n    <li>第二步加 AI 深讀，但同一天就把驗證守則立起來，不要等吃虧才補。</li>\n    <li>工具會一直換，架構不太會：數據層、深讀層、驗證層、判斷層、維護層。照這個順序疊，每一層都能獨立替換升級。</li>\n  </ol>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20ai-research-workflow\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>說明</h4>\n    <ul>\n      <li>本文描述之流程為作者實際使用的研究工作流架構，工具鏈組合依需求持續調整</li>\n      <li>文中不涉及任何特定標的之投資結論</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"diy-13f-tracker.html\">散戶版 13F 追蹤系統：用 Python + SEC EDGAR 免費自動化</a></li>\n      <li><a href=\"apple-etr.html\">Apple 的稅務密碼：ETR 從 14.7% 飆到 24.1%，再回到 15.6%，發生了什麼事</a></li>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人經驗分享，不構成投資建議。AI 工具產出內容須經獨立驗證，使用者應自行承擔查核責任。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",

<script>
(function () {
  const DATA = window.REVIEW_DATA;
  const STORE_KEY = "jeff-article-voice-review-v1";
  const articles = DATA.articles;
  let idx = 0;
  const views = { orig: "preview", sug: "preview", mine: "edit" };

  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
    catch { return {}; }
  }
  function saveStore(store) {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }
  function articleState(slug) {
    const store = loadStore();
    return store[slug] || {};
  }
  function setArticleState(slug, patch) {
    const store = loadStore();
    store[slug] = Object.assign({}, store[slug] || {}, patch, { updatedAt: new Date().toISOString() });
    saveStore(store);
  }

  function fixPreviewHtml(html) {
    return html
      .replace(/src="img\//g, 'src="../img/')
      .replace(/href="\.\.\/disclaimer\.html"/g, 'href="../disclaimer.html"');
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 1800);
  }

  function counted() {
    const store = loadStore();
    let n = 0;
    for (const a of articles) {
      const st = (store[a.slug] || {}).status;
      if (st && st !== "pending") n += 1;
    }
    return n;
  }

  function renderNav() {
    const store = loadStore();
    const nav = document.getElementById("nav-list");
    nav.innerHTML = articles.map((a, i) => {
      const st = (store[a.slug] || {}).status || "pending";
      return `<button class="nav-item${i === idx ? " active" : ""}" data-i="${i}" type="button">
        <span class="st ${st}"></span><span class="idx">${i + 1}.</span>${a.title_original}
      </button>`;
    }).join("");
    document.getElementById("progress").textContent = counted() + " / " + articles.length + " 已標記";
  }

  function current() { return articles[idx]; }

  function renderPane(which, html) {
    const el = document.getElementById(which === "orig" ? "orig-preview" : "sug-preview");
    if (views[which] === "source") {
      el.className = "pane-body";
      el.innerHTML = "";
      const ta = document.createElement("textarea");
      ta.className = "source-view";
      ta.readOnly = true;
      ta.value = html;
      el.appendChild(ta);
    } else {
      el.className = "pane-body article-preview";
      el.innerHTML = `<article class="post">${fixPreviewHtml(html)}</article>`;
    }
  }

  function renderMinePreview() {
    const wrap = document.getElementById("mine-wrap");
    const body = document.getElementById("mine-body").value;
    if (views.mine === "preview") {
      wrap.className = "pane-body article-preview";
      wrap.innerHTML = `<article class="post">${fixPreviewHtml(body)}</article>`;
    } else {
      wrap.className = "pane-body";
      wrap.innerHTML = `<textarea id="mine-body" spellcheck="false"></textarea>`;
      const ta = document.getElementById("mine-body");
      ta.value = body;
      ta.addEventListener("input", persistMine);
    }
  }

  function persistMine() {
    const a = current();
    setArticleState(a.slug, {
      title: document.getElementById("title-mine").value,
      description: document.getElementById("desc-mine").value,
      body: document.getElementById("mine-body") ? document.getElementById("mine-body").value : articleState(a.slug).body
    });
  }

  function render() {
    const a = current();
    const st = articleState(a.slug);
    document.getElementById("title-orig").textContent = a.title_original;
    document.getElementById("title-sug").textContent = a.title_suggested;
    document.getElementById("title-mine").value = st.title || a.title_suggested;
    document.getElementById("desc-orig").textContent = a.description_original;
    document.getElementById("desc-sug").textContent = a.description_suggested;
    document.getElementById("desc-mine").value = st.description || a.description_suggested;
    document.getElementById("issues").innerHTML =
      "<strong>這篇原文的 AI 語感問題</strong><ul>" +
      a.issues.map(x => "<li>" + x + "</li>").join("") + "</ul>";
    renderPane("orig", a.body_original);
    renderPane("sug", a.body_suggested);
    const mineVal = st.body || "";
    views.mine = "edit";
    const wrap = document.getElementById("mine-wrap");
    wrap.className = "pane-body";
    wrap.innerHTML = `<textarea id="mine-body" spellcheck="false" placeholder="把你改過的完整正文貼在這裡，或按「帶入右欄」從建議稿開始改。"></textarea>`;
    const ta = document.getElementById("mine-body");
    ta.value = mineVal;
    ta.addEventListener("input", persistMine);
    const labels = { pending: "未審", suggested: "已標記：採用建議稿", custom: "已標記：採用我的修訂", skip: "已標記：暫不改" };
    document.getElementById("status-hint").textContent = labels[st.status || "pending"];
    renderNav();
    history.replaceState(null, "", "#" + a.slug);
  }

  function packetFor(a, st) {
    const status = st.status || "custom";
    const title = st.title || a.title_suggested;
    const description = st.description || a.description_suggested;
    const body = (st.body && st.body.trim()) ? st.body : a.body_suggested;
    return [
      "=====ARTICLE_REVISION=====",
      "slug: " + a.slug,
      "path: " + a.path,
      "status: " + status,
      "title: " + title,
      "description: " + description,
      "-----BODY-----",
      body.trim(),
      "=====END====="
    ].join("\n");
  }

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch {
      toast("複製失敗，請改用下載 JSON");
    }
  }

  document.getElementById("nav-list").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-i]");
    if (!btn) return;
    persistMine();
    idx = Number(btn.dataset.i);
    render();
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    persistMine();
    idx = (idx + articles.length - 1) % articles.length;
    render();
  });
  document.getElementById("btn-next").addEventListener("click", () => {
    persistMine();
    idx = (idx + 1) % articles.length;
    render();
  });
  document.getElementById("btn-use-sug").addEventListener("click", () => {
    const a = current();
    document.getElementById("title-mine").value = a.title_suggested;
    document.getElementById("desc-mine").value = a.description_suggested;
    if (views.mine !== "edit") {
      views.mine = "edit";
      renderMinePreview();
    }
    document.getElementById("mine-body").value = a.body_suggested;
    persistMine();
    toast("已帶入建議稿，可直接在右欄改");
  });
  document.getElementById("btn-use-orig").addEventListener("click", () => {
    const a = current();
    document.getElementById("title-mine").value = a.title_original;
    document.getElementById("desc-mine").value = a.description_original;
    if (views.mine !== "edit") {
      views.mine = "edit";
      renderMinePreview();
    }
    document.getElementById("mine-body").value = a.body_original;
    persistMine();
    toast("已帶入原文");
  });
  document.getElementById("title-mine").addEventListener("input", persistMine);
  document.getElementById("desc-mine").addEventListener("input", persistMine);

  document.querySelectorAll("[data-view]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const which = btn.dataset.view;
      const mode = btn.dataset.mode;
      if (which === "mine" && views.mine === "edit") persistMine();
      views[which] = mode;
      const a = current();
      if (which === "orig") renderPane("orig", a.body_original);
      if (which === "sug") renderPane("sug", a.body_suggested);
      if (which === "mine") renderMinePreview();
    });
  });

  document.querySelectorAll("[data-status]").forEach((btn) => {
    btn.addEventListener("click", () => {
      persistMine();
      const a = current();
      setArticleState(a.slug, { status: btn.dataset.status });
      renderNav();
      const labels = { pending: "未審", suggested: "已標記：採用建議稿", custom: "已標記：採用我的修訂", skip: "已標記：暫不改" };
      document.getElementById("status-hint").textContent = labels[btn.dataset.status];
      toast(labels[btn.dataset.status]);
    });
  });

  document.getElementById("btn-copy-one").addEventListener("click", () => {
    persistMine();
    const a = current();
    const st = articleState(a.slug);
    const header = "請依下列修訂稿直接改網站上的對應中文文章（title、description、正文、FAQ 若有改一併改）。不要改英文鏡像。改完跑 python scripts/build_content.py。\n\n";
    copyText(header + packetFor(a, st), "本篇交接包已複製");
  });

  document.getElementById("btn-copy-all").addEventListener("click", () => {
    persistMine();
    const store = loadStore();
    const parts = [];
    for (const a of articles) {
      const st = store[a.slug] || {};
      if (!st.status || st.status === "pending" || st.status === "skip") continue;
      parts.push(packetFor(a, st));
    }
    if (!parts.length) {
      toast("還沒有標記「採用建議稿」或「採用我的修訂」的篇");
      return;
    }
    const header = "請依下列修訂稿直接改網站上的對應中文文章（title、description、正文、FAQ 若有改一併改）。不要改英文鏡像。改完跑 python scripts/build_content.py。\n\n";
    copyText(header + parts.join("\n\n"), "已複製 " + parts.length + " 篇");
  });

  document.getElementById("btn-download").addEventListener("click", () => {
    persistMine();
    const store = loadStore();
    const out = articles.map((a) => {
      const st = store[a.slug] || {};
      return {
        slug: a.slug,
        path: a.path,
        status: st.status || "pending",
        title: st.title || a.title_suggested,
        description: st.description || a.description_suggested,
        body: (st.body && st.body.trim()) ? st.body : a.body_suggested,
        updatedAt: st.updatedAt || null
      };
    });
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), articles: out }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "article-voice-revisions.json";
    link.click();
    URL.revokeObjectURL(url);
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("textarea, input")) return;
    if (e.key === "j" || e.key === "J") {
      persistMine();
      idx = (idx + 1) % articles.length;
      render();
    }
    if (e.key === "k" || e.key === "K") {
      persistMine();
      idx = (idx + articles.length - 1) % articles.length;
      render();
    }
  });

  const hash = location.hash.replace("#", "");
  const found = articles.findIndex((a) => a.slug === hash);
  if (found >= 0) idx = found;
  render();
})();
</script>
</body>
</html>
