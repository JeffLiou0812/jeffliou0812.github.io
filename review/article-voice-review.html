<script>
window.REVIEW_DATA = {
  "generated_at": "2026-08-13 08:53 +08:00",
  "count": 11,
  "howto": "逐篇對照原文與建議稿，在第三欄貼上或改出你的定稿，再複製交接包貼回 Cursor。",
  "articles": [
    {
      "slug": "ai-workflow-case",
      "path": "ai-workflow-case.html",
      "category": "代表作",
      "title_original": "我怎麼指揮 AI：實際案例",
      "title_suggested": "我怎麼指揮 AI：實際案例",
      "description_original": "展示 AI 工作流的設計過程：AI 指出設計盲點、由我做最終審查。傑夫哥的 AI 研究自動化方法。",
      "description_suggested": "展示 AI 工作流的設計過程：AI 指出設計盲點、由我做最終審查。傑夫哥的 AI 研究自動化方法。",
      "issues": [
        "背景段仍有偏短的單句收束",
        "雙視角驗算段未用「此亦可由另一角度分析」這句招牌轉折",
        "收尾「指揮 AI 的核心不是下指令的話術」略近金句斷言，可收進雖／但由於／故長句"
      ],
      "body_original": "<div class=\"callout\">本文描述的模型與工具規格為 2026 年 7 月當下的狀態，細節會隨版本演進；惟文中的分層原則與把關方法，不隨版本改變。</div>\n\n    <h2>背景：Claude Code 頂尖模型開放到 7 月 12 日可以無需另外付費，可繼續用既有訂閱方式使用</h2>\n\n    <p>2026 年 7 月，Anthropic 開放新一代旗艦模型 Fable 5 給付費訂閱者使用，但使用期僅限 7 月 12 日前。旗艦模型的 token 燒得很快，拿來做瑣碎無需推理判斷的任務相當浪費。</p>\n\n    <figure style=\"margin:1rem 0 1.4rem;\">\n      <img src=\"img/claude-code-usage-fable5.png\" alt=\"Claude Code 用量面板截圖：Context window 13%、5 小時限制 5%、Weekly all models 1%、Weekly Fable 獨立額度 2%，並顯示官方提示 Fable 5 is the most capable model and draws down usage much faster\" style=\"max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;\" loading=\"lazy\">\n      <figcaption style=\"font-size:.85rem;color:var(--muted);margin-top:.4rem;\">Claude Code 的用量面板：Fable 5 有獨立的每週額度，且官方明示它消耗額度更快（截圖 2026-07-09）。</figcaption>\n    </figure>\n\n    <p>為了節省 token，我用很簡單的指令給 Claude Code：</p>\n\n    <div class=\"callout\"><strong>Q：</strong>從今天到7月12日，是我可以使用fable 5模式的期間，設計一套運作模式，當需要整體架構設計、策略制定、重大事項相關的任務，由fable 5執行，其他任務由fable 5指揮Opus(並視複雜度判斷effort level)執行。</div>\n\n    <h2>AI 沒有照做，而是先檢查我的設計</h2>\n\n    <p>AI 回答（為方便閱讀，僅摘取重點內容）：</p>\n\n    <p>這是一個 meta 架構設計問題（非稅務/技術領域問題，無需讀專案檔；依據為本 harness 的實際工具規格 + 你的 CLAUDE.md/memory）。先給總評，再列技術陷阱與修正建議。</p>\n\n    <h3>總評</h3>\n\n    <p>方向正確：這就是 orchestrator-worker pattern，且和你既有的多模型盲審規則天然互補：Fable × Opus 是真正的跨模型互審，比同模型自審抓得到更多盲點。但照字面執行會踩到 4 個技術陷阱，需先修正。</p>\n\n    <ol>\n      <li>委派出去的子任務，預設仍由主模型執行（亦即忘記指定執行模型的委派，照樣燒旗艦額度，委派等於白做），故每次委派必須明確指定模型。</li>\n      <li>我想像中「視複雜度調整投入深度」的參數，在單次委派工具上根本不存在，要改走批次編排的路徑才做得到。</li>\n      <li>子任務是一段全新的對話，看不到主對話的任何脈絡，故每次委派都要附一份自包含的任務說明書；小任務委派的溝通成本，反而比主模型直接做更高。</li>\n      <li>指揮者出題、閱卷、裁決本身也消耗旗艦額度：委派省得掉「執行」，省不掉「判斷」。</li>\n    </ol>\n\n    <h2>關鍵修正：從「按重要性」改成「按判斷力槓桿」</h2>\n\n    <p>AI 接著更改我設計的核心：</p>\n\n    <table>\n      <tr><th>#</th><th>技術現實</th><th>對你設計的影響</th><th>對策</th></tr>\n      <tr><td>1</td><td>子 agent 預設繼承主會話 model = Fable</td><td>忘記指定 model 的委派，照樣燒 Fable 額度，委派等於白做</td><td>每次委派必須明帶 model: \"opus\"（或 haiku/sonnet）</td></tr>\n      <tr><td>2</td><td>Agent tool 沒有 effort 參數（只有 model override）</td><td>「視複雜度調 effort」單靠 Agent tool 做不到</td><td>兩條路：(a) 批次/多工改用 Workflow，agent() 可逐 call 設 effort low→max；(b) 建 custom agent 定義檔（frontmatter 可預設 model+effort），但建檔需你授權</td></tr>\n      <tr><td>3</td><td>子 agent 是全新 context，看不到本對話</td><td>每次委派要寫 self-contained brief；小任務委派的 overhead 反而比 Fable 直接做更貴</td><td>委派門檻（三條全過才委派）：任務自包含、輸出可壓成摘要、過程不需中途判斷</td></tr>\n      <tr><td>4</td><td>指揮者讀寫仍是 Fable token</td><td>委派省的是「執行」，省不掉「出題＋閱卷＋裁決」</td><td>主會話保持精簡，沿用你既有 200k 分支決策；額度以每日 /usage 校準（我看不到 Fable 配額）</td></tr>\n    </table>\n\n    <h2>建議的路由表（修正版）</h2>\n\n    <p>你的分法是「按重要性」，建議改成「按判斷力槓桿」：重要但機械的活照樣下放，Fable 的判斷用在 spec 和驗收兩端，不用在打字上。</p>\n\n    <p>修正後的分層：</p>\n\n    <table>\n      <tr><th>層級</th><th>執行者</th><th>任務類型</th></tr>\n      <tr><td>L1</td><td>旗艦模型親自做</td><td>架構與策略設計、多重規則交互的判斷、跨任務結果的整合裁決、關鍵文字定稿</td></tr>\n      <tr><td>L2</td><td>次級模型（高投入）</td><td>有明確規格的複雜執行：報告初稿、複雜程式、多來源研究彙整</td></tr>\n      <tr><td>L3</td><td>次級模型（低投入）</td><td>機械批次：檔案掃描、格式轉換、引用查核、資料抽取</td></tr>\n    </table>\n\n    <p>配套三條規則：</p>\n\n    <ul>\n      <li>委派門檻：任務自包含、輸出可壓縮成摘要、過程不需中途判斷，三條全過才委派。雖然把工作丟出去很省事，但由於子任務看不到主對話脈絡，說明書寫不清楚時返工成本更高，故不如主模型直接做。</li>\n      <li>上呈觸發器：委派任務遇到不可逆動作、來源互相矛盾、或信心不足時，一律停下來回報，不自行往下做。</li>\n      <li>跨模型互審：次級模型的產出由旗艦模型驗收；反過來，旗艦模型自己的產出，交給另一個模型獨立盲審（自己審自己的東西不算數，這是我行之有年的守則）。</li>\n    </ul>\n\n    <h2>雙視角驗算</h2>\n\n    <p>同一套設計可由另一角度驗算。從額度角度看，判斷集中在規格與驗收兩端、執行下放，稀缺資源的單位產出最大化；從品質角度看，跨模型互審讓兩個不同的模型互抓盲點，比單一模型自產自審多一層保險。兩個角度指向同一結論，這套修正版才定案。</p>\n\n    <h2>最後由我審核定案</h2>\n\n    <p>整段互動裡，AI 做了兩件事：指出我的設計與系統現實的落差，以及提出修正方案。但有幾件事不能給 AI 執行。重要、但規格已經明確的工作該歸哪一層，由我決定走「次級模型產、旗艦模型審」；整套模式要不要採用、授權範圍到哪裡，也是我決定。</p>\n\n    <p>這正是我在〈<a href=\"about.html\">關於傑夫哥</a>〉與〈<a href=\"services.html\">服務項目</a>〉寫的那句話的具體展開：程式與文字可以由 AI 產出，價值在於流程設計與驗證把關。指揮 AI 的核心不是下指令的話術，而是你自己得先有一套判斷標準，讓 AI 的反駁有東西可以對照，讓最終的裁決有依據。</p>\n\n    <div class=\"cta-box\">\n      <h4>需要為你的團隊設計 AI 研究工作流？</h4>\n      <p>這類 AI 研究工作流的設計和構思，是我承接的服務之一，詳見〈<a href=\"services.html\">服務項目</a>〉第 3 項「AI 研究自動化顧問」。</p>\n    </div>",

      "body_original": "<p>假設你持有 USD 500,000 的美股，某天意外身故。一般會以為這筆資產會留給家人，但實務上券商會凍結帳戶，家人必須向 IRS 申報美國遺產稅（Form 706-NA），取得完稅證明後才能領取資產。假設資產是美股與美國 ETF，稅額大約 USD 142,800，將近三成。</p>\n\n  <p>這就是美國遺產稅（US Estate Tax）。台灣投資人適用的免稅額是 USD 60,000，不隨通膨調整，已經幾十年沒改。</p>\n\n  <p>以下針對課稅範圍、正確算法、規劃方向進行說明。</p>\n\n  <h2>免稅額度差別極大：USD 15M vs USD 60k</h2>\n\n  <table>\n    <tr><th>身分</th><th>2026 年遺產稅免稅額</th><th>備註</th></tr>\n    <tr><td>美國公民 / 稅務居民</td><td>USD 15,000,000</td><td>2025 年 OBBBA 立法後永久化，逐年通膨調整</td></tr>\n    <tr><td>外國投資人（台灣人屬此類）</td><td>USD 60,000</td><td>不隨通膨調整，Form 706-NA 申報門檻</td></tr>\n  </table>\n\n  <p>從上表可知，免稅額度差了 250 倍。而且這跟你用台灣券商複委託還是美國券商無關。課稅依據是資產本身是不是「美國境內資產」（US-situs asset），美股就是「美國境內資產」，跟你用哪個帳戶買沒差。</p>\n\n  <h2>台灣人為什麼吃虧：沒有租稅協定保護</h2>\n\n  <p>同樣是外國人持有美股，日本人、英國人其實比台灣人優惠。美國目前訂有遺產或贈與稅協定的國家只有 15 個（澳洲、奧地利、加拿大、丹麥、芬蘭、法國、德國、希臘、愛爾蘭、義大利、日本、荷蘭、南非、瑞士、英國），這些國家的居民可以申請適用協定，拉高免稅額度（一般是依協定按「美國境內資產占全球資產的比例」提高 unified credit），或改用「居住地」而非「資產所在地」來分配課稅權。但很可惜，台灣不在名單上。</p>\n\n  <p>很多台灣人以為「台灣跟美國沒邦交、沒協定，那美國應該課不到我」，事實上剛好相反：正因為沒有協定可以援引，台灣投資人面臨美國遺產稅風險反而是最高。</p>\n\n  <div class=\"callout\">常有人問的 H.R. 33（台美租稅協定）：眾議院已於 2025 年 1 月 15 日以 423 比 1 通過，參議院同伴案 S.199 仍卡在財政委員會，截至 2026 年 7 月尚未完成立法。更重要的是，就算通過，協定適用範圍是薪資、股利、利息、退休金這類「所得稅」，並不是遺產稅協定，與本文談的 6 萬美元免稅額問題無關。雖然台美租稅協定的簽訂時程需要關注，但與「遺產稅」無關。</div>\n\n  <h2>哪些資產算 US-situs</h2>\n\n  <h3>課稅範圍（US-situs）</h3>\n  <ul>\n    <li>美國公司股票：AAPL、MSFT、NVDA 等所有美國註冊公司</li>\n    <li>美國掛牌、美國註冊的 ETF：SPY、QQQ、VTI、VOO 全部都是（ETF 本身是美國註冊基金的股份）</li>\n    <li>美國公司債、美國 REITs</li>\n    <li>美國註冊共同基金</li>\n  </ul>\n\n  <h3>免稅範圍（非 US-situs 或法定豁免）</h3>\n  <ul>\n    <li><strong>直接持有的美國公債</strong>（T-Bill、T-Note、T-Bond）：法定豁免，也就是免繳遺產稅的資產。注意「直接持有」，如果是用美國掛牌 ETF 包裝就不在免稅範圍內，詳見<a href=\"treasury-etf-estate-tax.html\">另一篇</a>。</li>\n    <li><strong>外國公司的 ADR</strong>：判斷標準是發行人所在國家。TSM ADR 的發行人是台積電（台灣公司），一般見解下不是 US-situs，詳見 <a href=\"tsm-adr-tax.html\">TSM ADR 篇</a>。</li>\n    <li><strong>愛爾蘭註冊 UCITS ETF</strong>：VWRA、CSPX 等，基金註冊在愛爾蘭，即使持有的全是美股，基金股份不是美國資產，而是愛爾蘭資產，免納美國遺產稅。</li>\n    <li>非美國掛牌的海外 ETF（例如香港掛牌的 2800）。</li>\n  </ul>\n\n  <div class=\"callout\">還有一個實務上不確定的灰色地帶：放在美國券商帳戶裡的「現金存款」。銀行存款明確被法定排除（IRC §2105(b)），但這個排除是否及於券商帳戶內的現金並不明確，一般見解偏向認定為 US-situs（也就是可能要課徵遺產稅），不同券商、不同架構也可能有不同結果。</div>\n\n  <h2>正確的稅額算法（網路上很多文章算錯）</h2>\n\n  <p>常見的錯誤是「先扣 USD 60,000 再乘上稅率」。法規運作方式是：對<strong>全部</strong> US-situs 遺產用累進稅率（18% 到 40%）算出稅額，再減除 USD 13,000 的抵減（unified credit，IRC §2102）。USD 60,000 免稅額的說法，是因為 USD 13,000 的抵減剛好等於 USD 60,000 遺產的稅額，兩種說法在遺產剛好 60k 時相同。</p>\n\n  <h3>案例一：全部位美國資產（假設案例）</h3>\n  <pre>\n組合：USD 500,000（美國個股 + 美國掛牌 ETF，全部 US-situs）\n\nStep 1  對 500,000 全額適用累進稅率\n        = 70,800 + 34% × (500,000 − 250,000)\n        = 70,800 + 85,000 = USD 155,800\nStep 2  減 unified credit 13,000\n        = 155,800 − 13,000 = USD 142,800\n\n有效稅率：142,800 / 500,000 = 28.6%\n家人實際取得：USD 357,200</pre>\n\n  <h3>案例二：同樣 USD 500,000，資產組成不同（假設案例）</h3>\n  <pre>\n組合：USD 100,000 美國個股（US-situs）\n      USD 100,000 愛爾蘭 UCITS ETF（非 US-situs）\n      USD 100,000 美國公債（豁免遺產稅）\n      USD 100,000 台股 ETF（非 US-situs）\n      USD 100,000 香港掛牌 ETF（非 US-situs）\n\nUS-situs 遺產：USD 100,000\nStep 1  依照稅率表計算：USD 23,800\nStep 2  減 credit 13,000 = USD 10,800\n\n家人實際取得：USD 489,200\n與案例一的差異：USD 132,000</pre>\n\n  <div class=\"assumption\">假設說明：兩個案例皆為假設情境，且未考慮台灣遺產稅（台灣居民全球遺產仍須申報台灣遺產稅，美國稅額可能有扣抵空間）、資產價格波動、券商作業費用。個案請諮詢合格稅務專業人員。</div>\n\n  <h2>即便遺產稅不高，也要注意資產可能會被凍結</h2>\n\n  <p>多數談美國遺產稅的文章講到稅額就結束，但真正關鍵其實不是稅，而是怎麼拿回資產。美國券商、過戶代理機構、銀行在把過世家人的資產交給繼承人之前，會要求一份 IRS 開立的「過戶證明」（Transfer Certificate，表格編號 Form 5173）。IRS 的規定是：這份證明要等到「遺產稅已繳清」之後才會核發。沒有這張證明，帳戶的資產無法提領。</p>\n\n  <p>帳戶資產的提領方式：US-situs 資產（連同生前贈與）超過 6 萬美元門檻的時候，繼承人要先申報 Form 706-NA（遺產稅申報期限一般是死亡日起 9 個月內），IRS 審核後才核發過戶證明。至於要等多久：IRS 針對「非居住、非美國公民」遺產的官方頁面明載，光是處理小額遺產（免申報 706-NA 那條切結書途徑）的文件就要 12 到 18 個月，需申報 706-NA 的高額遺產會更慢。換句話說，就算稅額不高、甚至低於門檻，家屬仍可能面對帳戶被凍結一年以上無法領取資產。</p>\n\n  <div class=\"callout\">如果沒有預先規劃、家屬又不熟悉美國法令，光是走完 Form 706-NA 加過戶證明，就可能讓一筆資產卡住一到兩年無法動用。這也就是為什麼「家人知不知道帳戶在哪、找不找得到人處理」，往往比要繳多少稅更該先想清楚。</div>\n\n  <h2>三個合法的規劃方向</h2>\n\n  <ol>\n    <li><strong>用愛爾蘭 UCITS ETF 替代美國掛牌 ETF。</strong>VWRA 替代 VT、CSPX 替代 SPY。額外的好處是股利預扣稅：愛爾蘭基金收美股股利適用美愛租稅協定 15%，台灣投資人直接持有美股股利被扣 30%。代價是流動性較低、部分券商不支援。愛爾蘭 ETF 會不會被全球最低稅課到？見 <a href=\"irish-etf-pillar-two.html\">Pillar Two 專篇</a>。</li>\n    <li><strong>配置美國公債。</strong>現金部位與債券部位改用直接持有的 T-Bill / T-Note，遺產稅豁免，利息所得對外國人也免美國預扣稅（portfolio interest）。</li>\n    <li><strong>高資產人士考慮資產規劃。</strong>USD 500k 以上的部位，可考慮透過保險或信託架構，但設立與維護成本高，必須找專業人士做完整評估。</li>\n  </ol>\n\n  <h2>自我檢核清單</h2>\n  <ul>\n    <li>你的美國個股 + 美國掛牌 ETF 總額是否超過 USD 60,000？</li>\n    <li>你的家人知道帳戶在哪、知道會有凍結與申報流程嗎？</li>\n    <li>你知道誰能幫家人處理 Form 706-NA 嗎？（多數台灣會計師沒做過，要找熟悉 NRA 遺產稅的美國會計師）</li>\n    <li>你的債券與現金部位，有沒有善用「直接持有公債」可以豁免遺產稅？</li>\n  </ul>\n\n  <h2>常見問題</h2>\n\n  <h3>台灣人買美股，美國遺產稅免稅額是多少？</h3>\n  <p>USD 60,000。美國公民與稅務居民 2026 年的免稅額是 USD 15,000,000，差 250 倍。這個門檻不隨通貨膨脹調整，而且跟你用台灣券商複委託還是美國券商無關，課稅依據只看是否為美國境內資產（US-situs）。</p>\n\n  <h3>超過 USD 60,000 是不是直接課 40%？</h3>\n  <p>不是，網路上「先扣 6 萬再乘稅率」的算法是錯的。正確算法：對全部 US-situs 遺產適用 18% 到 40% 累進稅率，再減 USD 13,000 的 unified credit（IRC §2102）。以 USD 500,000 全部投資美股為例，稅額約 USD 142,800，有效稅率約 28.6%；40% 邊際稅率要遺產超過 USD 1,000,000 才適用。</p>\n\n  <h3>哪些資產不用計入美國遺產稅？</h3>\n  <p>美國公債（T-Bill、T-Note、T-Bond）、外國發行人的 ADR（如 TSM ADR）、愛爾蘭註冊 UCITS ETF（VWRA、CSPX）、非美國掛牌的海外 ETF。注意：以美國掛牌 ETF 包裝架構的公債投資不在豁免範圍。</p>\n\n  <h3>美股投資人過世後，家人多久能提領美國券商帳戶裡的資產？</h3>\n  <p>美國券商會先凍結帳戶。US-situs 資產超過 6 萬美元門檻時，繼承人須申報 Form 706-NA（死亡日起 9 個月內），完稅後 IRS 才核發過戶證明（Form 5173），沒有這張證明資產無法提領。IRS 官方頁面明載：即便是小額遺產（免申報 706-NA 的切結書途徑）的文件處理就要 12 到 18 個月，需申報 706-NA 的遺產耗時更久。</p>\n\n  <h3>台美租稅協定（H.R. 33）通過後，遺產稅問題會解決嗎？</h3>\n  <p>不會。H.R. 33 與參議院同伴案 S.199 的適用範圍是薪資、股利、利息、退休金這類所得稅，不是遺產稅協定，與 6 萬美元免稅額無關；且截至 2026 年 7 月參議院尚未完成立法。美國目前有遺產或贈與稅協定的國家只有 15 個，台灣不在名單上。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20us-estate-tax-60k\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2101\" target=\"_blank\" rel=\"noopener\">IRC §2101<span class=\"sr-only\">（於新分頁開啟）</span></a>（Estate Tax for Nonresident Aliens）、<a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">§2104<span class=\"sr-only\">（於新分頁開啟）</span></a> / <a href=\"https://www.law.cornell.edu/uscode/text/26/2105\" target=\"_blank\" rel=\"noopener\">§2105<span class=\"sr-only\">（於新分頁開啟）</span></a>（situs 規則）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/estate-tax-for-nonresidents-not-citizens-of-the-united-states\" target=\"_blank\" rel=\"noopener\">IRS, Estate tax for nonresidents not citizens of the United States<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-04 查閱）</li>\n      <li><a href=\"https://www.irs.gov/forms-pubs/about-form-706-na\" target=\"_blank\" rel=\"noopener\">IRS Form 706-NA and Instructions<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/whats-new-estate-and-gift-tax\" target=\"_blank\" rel=\"noopener\">IRS, What's new - Estate and gift tax<span class=\"sr-only\">（於新分頁開啟）</span></a>（One Big Beautiful Bill Act 2025：2026 年起美國人免稅額提高至 USD 15M，Public Law 119-21）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/transfer-certificate-filing-requirements-for-the-estates-of-nonresidents-not-citizens-of-the-united-states\" target=\"_blank\" rel=\"noopener\">IRS, Transfer certificate filing requirements for the estates of nonresidents not citizens of the United States<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-06 查閱：Form 706-NA 申報門檻、過戶證明核發條件；Part B（無 706-NA 申報義務者）處理時間 12 到 18 個月）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/estate-gift-tax-treaties-international\" target=\"_blank\" rel=\"noopener\">IRS, Estate and gift tax treaties (international)<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-06 查閱：15 個協定國名單，台灣不在其中）</li>\n      <li><a href=\"https://www.congress.gov/bill/119th-congress/house-bill/33\" target=\"_blank\" rel=\"noopener\">H.R. 33 United States-Taiwan Expedited Double-Tax Relief Act<span class=\"sr-only\">（於新分頁開啟）</span></a>（119th Congress，眾議院 2025-01-15 以 423 比 1 通過，2026-07 仍在參議院財政委員會，屬所得稅範疇）</li>\n      <li>法規查核日期：2026-07-04（原文）、2026-07-06（本次增補）</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思，一次拆掉</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見，亦不構成 IRS Circular 230 規範之 tax opinion。個案情境請諮詢合格稅務專業人員。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>假設你持有 USD 500,000 的美股與美國 ETF，某天意外身故，一般會以為這筆資產會留給家人，然實務上券商會凍結帳戶，家人必須向 IRS 申報美國遺產稅（Form 706-NA），取得完稅證明後方能領取，稅額大約 USD 142,800（亦即將近三成）。這就是美國遺產稅（US Estate Tax）：台灣投資人適用的免稅額是 USD 60,000，不隨通膨調整，已經幾十年沒改。</p>\n\n  <h2>外國投資人的免稅額只有 USD 60,000</h2>\n\n  <table>\n    <tr><th>身分</th><th>2026 年遺產稅免稅額</th><th>備註</th></tr>\n    <tr><td>美國公民 / 稅務居民</td><td>USD 15,000,000</td><td>2025 年 OBBBA 立法後永久化，逐年通膨調整</td></tr>\n    <tr><td>外國投資人（台灣人屬此類）</td><td>USD 60,000</td><td>不隨通膨調整，Form 706-NA 申報門檻</td></tr>\n  </table>\n\n  <p>從上表可知，免稅額度差了 250 倍，而且這跟你用台灣券商複委託還是美國券商無關。課稅依據是資產本身是不是「美國境內資產」（US-situs asset），美股就是美國境內資產（亦即跟你用哪個帳戶買沒差）。</p>\n\n  <h2>台灣人為什麼吃虧：沒有租稅協定保護</h2>\n\n  <p>雖同為外國人持有美股，但由於美國目前訂有遺產或贈與稅協定的國家只有 15 個（澳洲、奧地利、加拿大、丹麥、芬蘭、法國、德國、希臘、愛爾蘭、義大利、日本、荷蘭、南非、瑞士、英國），故日、英等國居民可以申請適用協定，拉高免稅額度（一般是依協定按「美國境內資產占全球資產的比例」提高 unified credit），或改用「居住地」而非「資產所在地」來分配課稅權。惟台灣不在名單上。</p>\n\n  <p>沒有邦交、沒有協定，美國就課不到這筆遺產？剛好相反：正因為沒有協定可以援引，台灣投資人面臨的美國遺產稅風險反而是最高。</p>\n\n  <div class=\"callout\">常有人問的 H.R. 33（台美租稅協定）：眾議院已於 2025 年 1 月 15 日以 423 比 1 通過，參議院同伴案 S.199 仍卡在財政委員會，截至 2026 年 7 月尚未完成立法。更重要的是，就算通過，協定適用範圍是薪資、股利、利息、退休金這類所得稅，並不是遺產稅協定，與本文談的 6 萬美元免稅額問題無關。台美租稅協定的簽訂時程值得關注，惟與遺產稅無關。</div>\n\n  <h2>哪些資產算 US-situs</h2>\n\n  <h3>課稅範圍（US-situs）</h3>\n  <ul>\n    <li>美國公司股票：AAPL、MSFT、NVDA 等所有美國註冊公司</li>\n    <li>美國掛牌、美國註冊的 ETF：SPY、QQQ、VTI、VOO 全部都是（ETF 本身是美國註冊基金的股份）</li>\n    <li>美國公司債、美國 REITs</li>\n    <li>美國註冊共同基金</li>\n  </ul>\n\n  <h3>免稅範圍（非 US-situs 或法定豁免）</h3>\n  <ul>\n    <li><strong>直接持有的美國公債</strong>（T-Bill、T-Note、T-Bond）：法定豁免，也就是免繳遺產稅的資產。重點是「直接持有」，若用美國掛牌 ETF 包裝就不在免稅範圍內，詳見<a href=\"treasury-etf-estate-tax.html\">另一篇</a>。</li>\n    <li>外國公司的 ADR：判斷標準是發行人所在國家。TSM ADR 的發行人是台積電（台灣公司），一般見解下不是 US-situs，詳見 <a href=\"tsm-adr-tax.html\">TSM ADR 篇</a>。</li>\n    <li>愛爾蘭註冊 UCITS ETF：VWRA、CSPX 等，基金註冊在愛爾蘭，即使持有的全是美股，基金股份不是美國資產，而是愛爾蘭資產，免納美國遺產稅。</li>\n    <li>非美國掛牌的海外 ETF（例如香港掛牌的 2800）。</li>\n  </ul>\n\n  <div class=\"callout\">還有一個實務上不確定的灰色地帶：放在美國券商帳戶裡的現金。銀行存款明確被法定排除（IRC §2105(b)），惟此排除是否及於券商帳戶內的現金並不明確，一般見解偏向認定為 US-situs（亦即可能要計入遺產稅），不同券商、不同架構也可能有不同結果。</div>\n\n  <h2>正確的稅額算法（網路上很多文章算錯）</h2>\n\n  <p>常見的錯誤是「先扣 USD 60,000 再乘上稅率」，此算法毫無依據。法規運作方式是：對全部 US-situs 遺產用累進稅率（18% 到 40%）算出稅額，再減除 USD 13,000 的抵減（unified credit，IRC §2102）。USD 60,000 免稅額的說法，是因為 USD 13,000 的抵減剛好等於 USD 60,000 遺產的稅額（亦即兩種說法在遺產剛好 60k 時相同，超過之後就會分叉）。</p>\n\n  <h3>案例一：全部位美國資產（假設案例）</h3>\n  <pre>\n組合：USD 500,000（美國個股 + 美國掛牌 ETF，全部 US-situs）\n\nStep 1  對 500,000 全額適用累進稅率\n        = 70,800 + 34% × (500,000 − 250,000)\n        = 70,800 + 85,000 = USD 155,800\nStep 2  減 unified credit 13,000\n        = 155,800 − 13,000 = USD 142,800\n\n有效稅率：142,800 / 500,000 = 28.6%\n家人實際取得：USD 357,200</pre>\n\n  <h3>案例二：同樣 USD 500,000，資產組成不同（假設案例）</h3>\n  <pre>\n組合：USD 100,000 美國個股（US-situs）\n      USD 100,000 愛爾蘭 UCITS ETF（非 US-situs）\n      USD 100,000 美國公債（豁免遺產稅）\n      USD 100,000 台股 ETF（非 US-situs）\n      USD 100,000 香港掛牌 ETF（非 US-situs）\n\nUS-situs 遺產：USD 100,000\nStep 1  依照稅率表計算：USD 23,800\nStep 2  減 credit 13,000 = USD 10,800\n\n家人實際取得：USD 489,200\n與案例一的差異：USD 132,000</pre>\n\n  <p>此亦可由另一角度分析。案例一的有效稅率 28.6%，看起來像「還沒到 40% 邊際」，然家人實際取得僅 USD 357,200；案例二總部位同為 USD 500,000，惟 US-situs 壓到 USD 100,000 後稅額只剩 USD 10,800，家人取得 USD 489,200，兩者相差 USD 132,000。故規劃的槓桿在於縮減計入美國遺產的範圍，空談邊際稅率見樹不見林。</p>\n\n  <div class=\"assumption\">假設說明：兩個案例皆為假設情境，且未考慮台灣遺產稅（台灣居民全球遺產仍須申報台灣遺產稅，美國稅額可能有扣抵空間）、資產價格波動、券商作業費用。個案請諮詢合格稅務專業人員。</div>\n\n  <h2>即便遺產稅不高，也要注意資產可能會被凍結</h2>\n\n  <p>多數談美國遺產稅的文章講到稅額就結束，但真正關鍵其實不是稅，而是怎麼拿回資產。雖稅額本身未必高，但由於美國券商、過戶代理機構、銀行在把過世家人的資產交給繼承人之前，會要求一份 IRS 開立的過戶證明（Transfer Certificate，Form 5173），且該證明須待遺產稅已繳清後方能核發，故沒有這張證明，帳戶資產無法提領。</p>\n\n  <p>US-situs 資產（連同生前贈與）超過 6 萬美元門檻時，繼承人要先申報 Form 706-NA（遺產稅申報期限一般是死亡日起 9 個月內），IRS 審核後才核發過戶證明。至於要等多久：IRS 針對「非居住、非美國公民」遺產的官方頁面明載，光是處理小額遺產（免申報 706-NA 那條切結書途徑）的文件就要 12 到 18 個月，需申報 706-NA 的高額遺產會更慢。爰此，就算稅額不高、甚至低於門檻，家屬仍可能面對帳戶被凍結一年以上無法領取資產。</p>\n\n  <div class=\"callout\">若未預先規劃、家屬又不熟悉美國法令，走完 Form 706-NA 加過戶證明，資產卡住一到兩年無法動用並不罕見。家人知不知道帳戶在哪、找不找得到人處理，往往比要繳多少稅更該先想清楚。</div>\n\n  <h2>三個合法的規劃方向</h2>\n\n  <ol>\n    <li><strong>用愛爾蘭 UCITS ETF 替代美國掛牌 ETF。</strong>VWRA 替代 VT、CSPX 替代 SPY。額外的好處是股利預扣稅：愛爾蘭基金收美股股利適用美愛租稅協定 15%，台灣投資人直接持有美股股利被扣 30%。代價是流動性較低、部分券商不支援。愛爾蘭 ETF 與全球最低稅的關係，見 <a href=\"irish-etf-pillar-two.html\">Pillar Two 專篇</a>。</li>\n    <li>配置美國公債：現金部位與債券部位改用直接持有的 T-Bill / T-Note，遺產稅豁免，利息所得對外國人也免美國預扣稅（portfolio interest）。</li>\n    <li>高資產人士考慮資產規劃：USD 500k 以上的部位，可考慮透過保險或信託架構，但設立與維護成本高，必須找專業人士做完整評估。</li>\n  </ol>\n\n  <h2>自我檢核清單</h2>\n  <ul>\n    <li>你的美國個股 + 美國掛牌 ETF 總額是否超過 USD 60,000？</li>\n    <li>你的家人知道帳戶在哪、知道會有凍結與申報流程嗎？</li>\n    <li>你知道誰能幫家人處理 Form 706-NA 嗎？（多數台灣會計師沒做過，要找熟悉 NRA 遺產稅的美國會計師）</li>\n    <li>你的債券與現金部位，有沒有善用「直接持有公債」可以豁免遺產稅？</li>\n  </ul>\n\n  <h2>常見問題</h2>\n\n  <h3>台灣人買美股，美國遺產稅免稅額是多少？</h3>\n  <p>USD 60,000。美國公民與稅務居民 2026 年的免稅額是 USD 15,000,000，差 250 倍。這個門檻不隨通貨膨脹調整，而且跟你用台灣券商複委託還是美國券商無關，課稅依據只看是否為美國境內資產（US-situs）。</p>\n\n  <h3>超過 USD 60,000 是不是直接課 40%？</h3>\n  <p>不是。網路上「先扣 6 萬再乘稅率」的算法毫無依據。正確算法是對全部 US-situs 遺產適用 18% 到 40% 累進稅率，再減 USD 13,000 的 unified credit（IRC §2102）。以 USD 500,000 全部投資美股為例，稅額約 USD 142,800，有效稅率約 28.6%；40% 邊際稅率要遺產超過 USD 1,000,000 才適用。</p>\n\n  <h3>哪些資產不用計入美國遺產稅？</h3>\n  <p>美國公債（T-Bill、T-Note、T-Bond）、外國發行人的 ADR（如 TSM ADR）、愛爾蘭註冊 UCITS ETF（VWRA、CSPX）、非美國掛牌的海外 ETF。以美國掛牌 ETF 包裝架構的公債投資不在豁免範圍。</p>\n\n  <h3>美股投資人過世後，家人多久能提領美國券商帳戶裡的資產？</h3>\n  <p>美國券商會先凍結帳戶。US-situs 資產超過 6 萬美元門檻時，繼承人須申報 Form 706-NA（死亡日起 9 個月內），完稅後 IRS 才核發過戶證明（Form 5173），沒有這張證明資產無法提領。IRS 官方頁面明載：即便是小額遺產（免申報 706-NA 的切結書途徑）的文件處理就要 12 到 18 個月，需申報 706-NA 的遺產耗時更久。</p>\n\n  <h3>台美租稅協定（H.R. 33）通過後，遺產稅問題會解決嗎？</h3>\n  <p>不會。H.R. 33 與參議院同伴案 S.199 的適用範圍是薪資、股利、利息、退休金這類所得稅，不是遺產稅協定，與 6 萬美元免稅額無關；且截至 2026 年 7 月參議院尚未完成立法。美國目前有遺產或贈與稅協定的國家只有 15 個，台灣不在名單上。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20us-estate-tax-60k\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2101\" target=\"_blank\" rel=\"noopener\">IRC §2101<span class=\"sr-only\">（於新分頁開啟）</span></a>（Estate Tax for Nonresident Aliens）、<a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">§2104<span class=\"sr-only\">（於新分頁開啟）</span></a> / <a href=\"https://www.law.cornell.edu/uscode/text/26/2105\" target=\"_blank\" rel=\"noopener\">§2105<span class=\"sr-only\">（於新分頁開啟）</span></a>（situs 規則）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/estate-tax-for-nonresidents-not-citizens-of-the-united-states\" target=\"_blank\" rel=\"noopener\">IRS, Estate tax for nonresidents not citizens of the United States<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-04 查閱）</li>\n      <li><a href=\"https://www.irs.gov/forms-pubs/about-form-706-na\" target=\"_blank\" rel=\"noopener\">IRS Form 706-NA and Instructions<span class=\"sr-only\">（於新分頁開啟）</span></a></li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/whats-new-estate-and-gift-tax\" target=\"_blank\" rel=\"noopener\">IRS, What's new - Estate and gift tax<span class=\"sr-only\">（於新分頁開啟）</span></a>（One Big Beautiful Bill Act 2025：2026 年起美國人免稅額提高至 USD 15M，Public Law 119-21）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/transfer-certificate-filing-requirements-for-the-estates-of-nonresidents-not-citizens-of-the-united-states\" target=\"_blank\" rel=\"noopener\">IRS, Transfer certificate filing requirements for the estates of nonresidents not citizens of the United States<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-06 查閱：Form 706-NA 申報門檻、過戶證明核發條件；Part B（無 706-NA 申報義務者）處理時間 12 到 18 個月）</li>\n      <li><a href=\"https://www.irs.gov/businesses/small-businesses-self-employed/estate-gift-tax-treaties-international\" target=\"_blank\" rel=\"noopener\">IRS, Estate and gift tax treaties (international)<span class=\"sr-only\">（於新分頁開啟）</span></a>（irs.gov，2026-07-06 查閱：15 個協定國名單，台灣不在其中）</li>\n      <li><a href=\"https://www.congress.gov/bill/119th-congress/house-bill/33\" target=\"_blank\" rel=\"noopener\">H.R. 33 United States-Taiwan Expedited Double-Tax Relief Act<span class=\"sr-only\">（於新分頁開啟）</span></a>（119th Congress，眾議院 2025-01-15 以 423 比 1 通過，2026-07 仍在參議院財政委員會，屬所得稅範疇）</li>\n      <li>法規查核日期：2026-07-04（原文）、2026-07-06（本次增補）</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n      <li><a href=\"irish-etf-pillar-two.html\">愛爾蘭 ETF 會被全球最低稅 15% 課到嗎？</a></li>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見，亦不構成 IRS Circular 230 規範之 tax opinion。個案情境請諮詢合格稅務專業人員。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "body_original": "<p>你是住在台灣的外國人：來工作的工程師、教書的老師，或跟著配偶定居的家庭成員。你在海外券商有帳戶，持有美股與 ETF，每年有配息和已實現的損益。一個很多人到報稅季才想到的問題：<strong>台灣什麼時候開始「看得到」你的境外投資？</strong></p>\n\n  <p>答案幾乎只取決於一個數字：你這一年在台灣住了幾天。183 天，是你的境外投資損益從「完全不在台灣課稅範圍內」變成「進入台灣最低稅負制」的分界線。這篇把認定規則、身分翻轉的後果、以及外國人特有的三個細節一次講清楚。</p>\n\n  <h2>183 天怎麼算：始日不計、末日計、全年累積</h2>\n\n  <p>法源是所得稅法第 7 條第 2 項。「中華民國境內居住之個人」有兩種：</p>\n\n  <ol>\n    <li>在台灣境內<strong>有住所</strong>，並經常居住台灣境內者（這款實務上主要適用於在台灣有戶籍的本國人）</li>\n    <li>在台灣境內<strong>無住所</strong>，而於一課稅年度內在台灣境內<strong>居留合計滿 183 天</strong>者</li>\n  </ol>\n\n  <p>外國人通常在台灣沒有戶籍、也不構成第一款的住所要件，所以適用第二款：純粹數天數。國稅局實務的計算規則：</p>\n\n  <ul>\n    <li><strong>課稅年度＝曆年</strong>（1 月 1 日到 12 月 31 日），天數不跨年累計，每年 1 月 1 日歸零重算</li>\n    <li>以<strong>護照入出境章戳日期</strong>（或移民署「入出國日期證明書」）為準</li>\n    <li><strong>始日不計、末日計</strong>：入境當天不算，出境當天算</li>\n    <li>一年內多次入出境，<strong>累積計算</strong></li>\n  </ul>\n\n  <p>國稅局自己給的例子：4 月 2 日入境、5 月 10 日出境，計 38 天；7 月 2 日再入境、住到年底未出境，計 182 天。全年合計 220 天，是居住者。</p>\n\n  <h2>居留天數其實有三個門檻，不是只有 183</h2>\n\n  <table>\n    <tr><th>全年居留天數</th><th>身分</th><th>台灣來源所得</th><th>境外投資損益</th></tr>\n    <tr><td>90 天以下</td><td>非居住者</td><td>就源扣繳（股利 21%、薪資 18% 等），境外雇主給付的薪酬不視為台灣來源所得</td><td><strong>台灣完全不課</strong></td></tr>\n    <tr><td>超過 90 天、未滿 183 天</td><td>非居住者</td><td>就源扣繳；境外雇主給付的在台提供勞務之報酬變成台灣來源所得，非扣繳範圍所得應於離境前按扣繳率申報</td><td><strong>台灣完全不課</strong></td></tr>\n    <tr><td>滿 183 天</td><td><strong>居住者</strong></td><td>併入綜合所得稅結算申報（5% 到 40% 累進，次年 5 月申報）</td><td><strong>進入最低稅負制</strong></td></tr>\n  </table>\n\n  <p>90 天那條線影響的是<strong>薪資</strong>（境外雇主給付的部分）；183 天這條線影響的才是你的<strong>投資</strong>。這篇談投資，所以主角是 183。</p>\n\n  <h2>翻過 183 天，境外投資發生什麼事：一條四步的法律邏輯鏈</h2>\n\n  <ol>\n    <li>台灣的個人綜合所得稅原則上只課<strong>中華民國來源所得</strong>。你的美股配息、海外資本利得不是台灣來源所得，不論你是什麼身分，都<strong>不會</strong>進綜合所得稅。</li>\n    <li>但居住者另外適用<strong>最低稅負制</strong>（所得基本稅額條例）：海外所得要計入「基本所得額」。</li>\n    <li>非居住者被條例<strong>第 3 條第 1 項第 5 款明文排除</strong>在整套制度之外。天數不到 183，最低稅負制與你完全無關，台灣對你的境外投資是零掌握、零課稅。</li>\n    <li>滿 183 天，你成為居住者，排除條款失效，海外所得進入基本所得額。<strong>條例看的是居住身分，不是國籍</strong>：外國人滿 183 天，和台灣人適用完全相同的規則。</li>\n  </ol>\n\n  <p>進入最低稅負制之後的機制速覽（每一條都有常見誤解，完整拆解見<a href=\"overseas-income-750-myth.html\">海外所得 750 萬迷思</a>一文）：</p>\n\n  <ul>\n    <li><strong>100 萬是懸崖不是起徵點</strong>：全戶全年海外所得未達新台幣 100 萬完全不計入；達到 100 萬，全額計入。</li>\n    <li><strong>750 萬扣的是「基本所得額」</strong>（綜合所得淨額＋海外所得＋特定保險給付等），不是海外所得本身。基本稅額＝（基本所得額 − 750 萬）× 20%。</li>\n    <li><strong>算出來還要比大小</strong>：基本稅額大於一般綜所稅額時，只補差額。在台灣領高薪的外國人，綜所稅本身就高，海外所得的「隱形額度」反而大，實際補稅常常是 0。</li>\n    <li><strong>境外已納稅額可扣抵</strong>：上限是因加計該海外所得而增加的基本稅額，法規要求檢附來源地稅務機關納稅憑證（美股扣繳實務多以券商 1042-S 佐證，惟稽徵機關得要求補正）。</li>\n    <li><strong>補稅 0 不等於免申報</strong>：基本所得額超過 750 萬就應申報基本稅額申報表，即使比較後補繳是 0。</li>\n  </ul>\n\n  <h2>外國人特有的三個細節</h2>\n\n  <h3>細節一：規劃單位是「年度」，不是「入境日」</h3>\n  <p>居住者身分是按<strong>整個課稅年度</strong>認定的：第一年住不滿 183 天，那一整年你都是非居住者，該年度實現的境外損益台灣不課；哪一年住滿 183 天，那一年就是居住者年度。所以大額已實現損益的時點規劃，正確的單位是年度。如果你明年起會長住台灣（明年會滿 183 天），想把大額獲利了結留在台灣課稅範圍外，要在<strong>今年</strong>完成，而不是趕在明年的入境日之前。</p>\n\n  <h3>細節二：雙重居民，先看租稅協定</h3>\n  <p>住滿 183 天的同時，你可能仍是母國的稅務居民（多數國家有自己的居民認定）。台灣目前有 35 個生效的所得稅協定（日本、英國、澳洲等；<strong>美國不在其中</strong>），協定的加比規則（tie-breaker：永久住所、重要利益中心、慣常居所、國籍）決定兩邊誰退讓。母國與台灣有協定的人，先看協定再算台灣的稅；來自無協定國家（含美國）的人，兩邊各課各的，只能靠各自國內法的外國稅額扣抵消化重複課稅。</p>\n\n  <h3>細節三：遺產稅是另一套邏輯，別把 183 天帶過去</h3>\n  <p>所得稅看「住多久」，台灣遺產稅看的卻是「<strong>國籍＋經常居住</strong>」：依遺產及贈與稅法第 1 條，非中華民國國民不論在台灣住了幾年，<strong>只就台灣境內的遺產</strong>課台灣遺產稅，境外資產（含你的美股）不進台灣遺產稅，且多數身分別扣除額（配偶、子女等）對非國民不適用。但別高興太早：你的美股部位面對的是<strong>美國</strong>遺產稅，非美國人只有 USD 60,000 免稅額，這與你的台灣身分完全無關（完整解析見<a href=\"us-estate-tax-60k.html\">美國遺產稅 60,000 門檻</a>一文）。</p>\n\n  <h2>自我檢查表</h2>\n\n  <ul>\n    <li>今年的在台天數算過了嗎？（護照戳記為準、始日不計末日計、多次入出境累積）</li>\n    <li>你是「今年就會滿 183」還是「明年才會滿」？大額已實現損益的年度歸屬想清楚了嗎？</li>\n    <li>母國與台灣有沒有租稅協定？有的話 tie-breaker 結果是什麼？</li>\n    <li>成為居住者的年度起：全戶海外所得有沒有達 100 萬？基本所得額有沒有超過 750 萬（申報義務）？</li>\n    <li>海外已納稅的憑證（1042-S 等）留存了嗎？</li>\n  </ul>\n\n  <h2>結論</h2>\n\n  <ol>\n    <li>外國人在台灣的稅務居民認定幾乎只看一件事：<strong>曆年內居留合計滿 183 天</strong>（始日不計、末日計、累積計算、每年歸零）。</li>\n    <li>滿 183 天前後的最大差異不在薪資，在<strong>境外投資</strong>：從台灣完全課不到（條例第 3 條明文排除非居住者），變成進入最低稅負制。</li>\n    <li>制度有三道緩衝：100 萬計入門檻、750 萬扣除額、與綜所稅比大小。在台領高薪的外國人實際補稅常是 0，但<strong>申報義務與補稅金額是兩回事</strong>。</li>\n    <li>年度是規劃單位；雙重居民先看協定（美國沒有）；遺產稅走國籍原則，是完全另一套邏輯。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以無中華民國戶籍、非中華民國國民的外國個人為準。具台灣戶籍者的居住者認定另有 31 天與生活及經濟重心標準（財政部 101 年令釋），不在本文範圍。美國公民與綠卡持有人另受美國全球課稅，台灣端稅負在美國端的外國稅額扣抵屬美國稅法問題，請諮詢美國稅務專業人員。個人受控外國企業（CFC，條例第 12 條之 1）、信託架構等特殊情境不在本文範圍。750 萬／3,740 萬為 113 年度（2024）起適用的公告調整數；100 萬為條例明定金額，未隨物價調整。個案請諮詢合格稅務專業人員。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>外國人在台灣住多久會變成稅務居民？</h3>\n  <p>一個課稅年度（曆年）內在台灣居留合計滿 183 天（所得稅法第 7 條第 2 項）。計算規則：以護照入出境章戳為準、始日不計末日計、多次入出境累積計算、每年 1 月 1 日歸零重算。</p>\n\n  <h3>住不滿 183 天，海外投資收益台灣會課稅嗎？</h3>\n  <p>完全不課。非居住者被所得基本稅額條例第 3 條第 1 項第 5 款明文排除在最低稅負制之外，境外的配息與資本利得不在台灣課稅範圍內。</p>\n\n  <h3>滿 183 天之後，海外所得怎麼課稅？</h3>\n  <p>須注意最低稅負制：全戶全年海外所得達新台幣 100 萬即全額計入基本所得額（未達門檻則全數不計入）；基本稅額＝（基本所得額 − 750 萬）× 20%；算出後再與一般綜所稅額比大小，取其高繳稅。在台領高薪的外國人實際補稅常常是 0。</p>\n\n  <h3>外國人在台灣過世，美股會被台灣課遺產稅嗎？</h3>\n  <p>不會。台灣遺產稅對非中華民國國民只課台灣境內遺產（遺產及贈與稅法第 1 條），境外資產（含美股）不進台灣遺產稅。但要注意：美股要面對的是美國遺產稅，非美國人免稅額只有 USD 60,000，這與是否為台灣人無關。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20foreigner-taiwan-tax-resident\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0340003&amp;flno=7\" target=\"_blank\" rel=\"noopener\">所得稅法第 7 條<span class=\"sr-only\">（於新分頁開啟）</span></a>（境內居住之個人定義）；全國法規資料庫 law.moj.gov.tw</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340115\" target=\"_blank\" rel=\"noopener\">所得基本稅額條例<span class=\"sr-only\">（於新分頁開啟）</span></a>第 3 條（非居住者排除，第 1 項第 5 款）、第 12 條（海外所得 100 萬計入門檻）、第 13 條（扣除額與 20% 稅率、境外已納稅額扣抵）；750 萬為 113 年度起公告調整數，100 萬為條例明定金額</li>\n      <li>財政部臺北國稅局「計算居留天數」、「稅務居民身分及相關申報作業」；財政部稅務入口網外僑專區（始日不計末日計、護照章戳、累積計算、90/183 天申報義務）</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072\" target=\"_blank\" rel=\"noopener\">遺產及贈與稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>第 1 條（非國民僅就境內遺產課稅）、第 17 條（身分別扣除額之適用限制）</li>\n      <li>財政部：台灣生效所得稅協定清單（35 個生效協定）</li>\n      <li>法規查核日期：2026-07-05</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思，一次拆掉</a></li>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>你是住在台灣的外國人：來工作的工程師、教書的老師，或跟著配偶定居的家庭成員，海外券商裡有美股與 ETF，每年有配息和已實現損益。台灣什麼時候開始看得到你的境外投資，幾乎只取決於一個數字：你這一年在台灣住了幾天。183 天，是境外投資損益從完全不在台灣課稅範圍內，變成進入最低稅負制的分界線（亦即非居住者被條例排除，居住者才把海外所得計入基本所得額）。</p>\n\n  <h2>183 天怎麼算：始日不計、末日計、全年累積</h2>\n\n  <p>法源是所得稅法第 7 條第 2 項。「中華民國境內居住之個人」有兩種：</p>\n\n  <ol>\n    <li>在台灣境內有住所，並經常居住台灣境內者（這款實務上主要適用於在台灣有戶籍的本國人）</li>\n    <li>在台灣境內無住所，而於一課稅年度內在台灣境內<strong>居留合計滿 183 天</strong>者</li>\n  </ol>\n\n  <p>雖外國人通常在台灣沒有戶籍、也不構成第一款的住所要件，但由於第二款純粹數天數，故適用規則就是把曆年內的居留加總。國稅局實務的計算規則如下：</p>\n\n  <ul>\n    <li>課稅年度＝曆年（1 月 1 日至 12 月 31 日），天數不跨年累計，每年 1 月 1 日歸零重算</li>\n    <li>以護照入出境章戳日期（或移民署「入出國日期證明書」）為準</li>\n    <li>始日不計、末日計：入境當天不算，出境當天算</li>\n    <li>一年內多次入出境，累積計算</li>\n  </ul>\n\n  <p>國稅局自己給的例子：4 月 2 日入境、5 月 10 日出境，計 38 天；7 月 2 日再入境、住到年底未出境，計 182 天。全年合計 220 天，是居住者。</p>\n\n  <p>此亦可由另一角度分析。同一組入出境紀錄若跨了 12 月 31 日，下一段天數要等到次年 1 月 1 日歸零後重算，故「住很久」與「當年度滿 183 天」不是同一件事；真正翻轉身分的不是單次停留長短，是曆年累積有沒有跨過 183。</p>\n\n  <h2>90 天與 183 天各管什麼</h2>\n\n  <table>\n    <tr><th>全年居留天數</th><th>身分</th><th>台灣來源所得</th><th>境外投資損益</th></tr>\n    <tr><td>90 天以下</td><td>非居住者</td><td>就源扣繳（股利 21%、薪資 18% 等），境外雇主給付的薪酬不視為台灣來源所得</td><td>台灣完全不課</td></tr>\n    <tr><td>超過 90 天、未滿 183 天</td><td>非居住者</td><td>就源扣繳；境外雇主給付的在台提供勞務之報酬變成台灣來源所得，非扣繳範圍所得應於離境前按扣繳率申報</td><td>台灣完全不課</td></tr>\n    <tr><td>滿 183 天</td><td>居住者</td><td>併入綜合所得稅結算申報（5% 到 40% 累進，次年 5 月申報）</td><td><strong>進入最低稅負制</strong></td></tr>\n  </table>\n\n  <p>90 天那條線影響的是薪資（境外雇主給付的部分）；183 天這條線影響的才是你的投資。本文談投資，故分界是 183。具台灣戶籍者另有 31 天與生活及經濟重心標準，本文不擬深入探討。</p>\n\n  <h2>滿 183 天之後，境外投資如何進入最低稅負制</h2>\n\n  <ol>\n    <li>台灣的個人綜合所得稅原則上只課中華民國來源所得。你的美股配息、海外資本利得不是台灣來源所得，不論你是什麼身分，都不會進綜合所得稅。</li>\n    <li>但居住者另外適用最低稅負制（所得基本稅額條例）：海外所得要計入「基本所得額」。</li>\n    <li>非居住者被條例第 3 條第 1 項第 5 款明文排除在整套制度之外（因為排除的是身分，非海外所得本身免稅）。天數不到 183，最低稅負制與你完全無關，台灣對你的境外投資是零掌握、零課稅。</li>\n    <li>滿 183 天，你成為居住者，排除條款失效，海外所得進入基本所得額。條例看的是居住身分，不是國籍：外國人滿 183 天，和台灣人適用完全相同的規則。</li>\n  </ol>\n\n  <p>進入最低稅負制之後的機制（每一條都有常見誤解，完整說明見<a href=\"overseas-income-750-myth.html\">海外所得 750 萬迷思</a>一文）：</p>\n\n  <ul>\n    <li>100 萬是計入門檻，不是起徵點：全戶全年海外所得未達新台幣 100 萬完全不計入；達到 100 萬，全額計入。</li>\n    <li><strong>750 萬扣的是「基本所得額」</strong>（綜合所得淨額＋海外所得＋特定保險給付等），不是海外所得本身。基本稅額＝（基本所得額 − 750 萬）× 20%。</li>\n    <li>算出來還要比大小：基本稅額大於一般綜所稅額時，只補差額。在台灣領高薪的外國人，綜所稅本身就高，海外所得能被「吃進去」的額度反而大，實際補稅常常是 0。</li>\n    <li>境外已納稅額可扣抵：上限是因加計該海外所得而增加的基本稅額，法規要求檢附來源地稅務機關納稅憑證（美股扣繳實務多以券商 1042-S 佐證，惟稽徵機關得要求補正）。</li>\n    <li>補稅 0 不等於免申報：基本所得額超過 750 萬就應申報基本稅額申報表，即使比較後補繳是 0。</li>\n  </ul>\n\n  <h2>外國人還要另外看的三件事</h2>\n\n  <h3>大額損益的規劃單位是課稅年度</h3>\n  <p>居住者身分是按整個課稅年度認定的：第一年住不滿 183 天，那一整年你都是非居住者，該年度實現的境外損益台灣不課；哪一年住滿 183 天，那一年就是居住者年度。爰此，大額已實現損益的時點規劃，正確的單位是年度。趕在明年入境日之前賣掉，就能把獲利留在非居住者年度嗎？不能。若你明年起會長住台灣（明年會滿 183 天），想把大額獲利了結留在台灣課稅範圍外，要在今年完成，而不是卡在明年的入境日。</p>\n\n  <h3>雙重居民應先看租稅協定</h3>\n  <p>住滿 183 天的同時，你可能仍是母國的稅務居民（多數國家有自己的居民認定）。台灣目前有 35 個生效的所得稅協定（日本、英國、澳洲等；美國不在其中），協定的加比規則（tie-breaker：永久住所、重要利益中心、慣常居所、國籍）決定兩邊誰退讓。母國與台灣有協定的人，先看協定再算台灣的稅；來自無協定國家（含美國）的人，兩邊各課各的，只能靠各自國內法的外國稅額扣抵消化重複課稅。</p>\n\n  <h3>遺產稅的判斷與 183 天無關</h3>\n  <p>所得稅看「住多久」，台灣遺產稅看的卻是國籍與經常居住：依遺產及贈與稅法第 1 條，非中華民國國民不論在台灣住了幾年，只就台灣境內的遺產課台灣遺產稅，境外資產（含你的美股）不進台灣遺產稅，且多數身分別扣除額（配偶、子女等）對非國民不適用。然美股部位面對的是美國遺產稅，非美國人只有 USD 60,000 免稅額，這與你的台灣身分完全無關（完整說明見<a href=\"us-estate-tax-60k.html\">美國遺產稅 60,000 門檻</a>一文）。</p>\n\n  <h2>自我檢查表</h2>\n\n  <ul>\n    <li>今年的在台天數算過了嗎？（護照戳記為準、始日不計末日計、多次入出境累積）</li>\n    <li>你是「今年就會滿 183」還是「明年才會滿」？大額已實現損益的年度歸屬想清楚了嗎？</li>\n    <li>母國與台灣有沒有租稅協定？有的話 tie-breaker 結果是什麼？</li>\n    <li>成為居住者的年度起：全戶海外所得有沒有達 100 萬？基本所得額有沒有超過 750 萬（申報義務）？</li>\n    <li>海外已納稅的憑證（1042-S 等）留存了嗎？</li>\n  </ul>\n\n  <h2>結論</h2>\n\n  <ol>\n    <li>外國人在台灣的稅務居民認定幾乎只看一件事：曆年內居留合計滿 183 天（始日不計、末日計、累積計算、每年歸零）。</li>\n    <li>滿 183 天前後的最大差異不在薪資，在境外投資：從台灣完全課不到（條例第 3 條明文排除非居住者），變成進入最低稅負制。</li>\n    <li>制度有三道緩衝：100 萬計入門檻、750 萬扣除額、與綜所稅比大小。在台領高薪的外國人實際補稅常是 0，但<strong>申報義務與補稅金額是兩回事</strong>。</li>\n    <li>綜合以上：年度是規劃單位；雙重居民先看協定（美國沒有）；遺產稅走國籍原則，是完全另一套邏輯。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以無中華民國戶籍、非中華民國國民的外國個人為準。具台灣戶籍者的居住者認定另有 31 天與生活及經濟重心標準（財政部 101 年令釋），不在本文範圍。美國公民與綠卡持有人另受美國全球課稅，台灣端稅負在美國端的外國稅額扣抵屬美國稅法問題，請諮詢美國稅務專業人員。個人受控外國企業（CFC，條例第 12 條之 1）、信託架構等特殊情境不在本文範圍。750 萬／3,740 萬為 113 年度（2024）起適用的公告調整數；100 萬為條例明定金額，未隨物價調整。個案請諮詢合格稅務專業人員。</div>\n\n  <h2>常見問題</h2>\n\n  <h3>外國人在台灣住多久會變成稅務居民？</h3>\n  <p>一個課稅年度（曆年）內在台灣居留合計滿 183 天（所得稅法第 7 條第 2 項）。計算規則：以護照入出境章戳為準、始日不計末日計、多次入出境累積計算、每年 1 月 1 日歸零重算。</p>\n\n  <h3>住不滿 183 天，海外投資收益台灣會課稅嗎？</h3>\n  <p>完全不課。非居住者被所得基本稅額條例第 3 條第 1 項第 5 款明文排除在最低稅負制之外，境外的配息與資本利得不在台灣課稅範圍內。</p>\n\n  <h3>滿 183 天之後，海外所得怎麼課稅？</h3>\n  <p>須注意最低稅負制：全戶全年海外所得達新台幣 100 萬即全額計入基本所得額（未達門檻則全數不計入）；基本稅額＝（基本所得額 − 750 萬）× 20%；算出後再與一般綜所稅額比大小，取其高繳稅。在台領高薪的外國人實際補稅常常是 0。</p>\n\n  <h3>外國人在台灣過世，美股會被台灣課遺產稅嗎？</h3>\n  <p>不會。台灣遺產稅對非中華民國國民只課台灣境內遺產（遺產及贈與稅法第 1 條），境外資產（含美股）不進台灣遺產稅。然美股要面對的是美國遺產稅，非美國人免稅額只有 USD 60,000，這與是否為台灣人無關。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20foreigner-taiwan-tax-resident\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0340003&amp;flno=7\" target=\"_blank\" rel=\"noopener\">所得稅法第 7 條<span class=\"sr-only\">（於新分頁開啟）</span></a>（境內居住之個人定義）；全國法規資料庫 law.moj.gov.tw</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340115\" target=\"_blank\" rel=\"noopener\">所得基本稅額條例<span class=\"sr-only\">（於新分頁開啟）</span></a>第 3 條（非居住者排除，第 1 項第 5 款）、第 12 條（海外所得 100 萬計入門檻）、第 13 條（扣除額與 20% 稅率、境外已納稅額扣抵）；750 萬為 113 年度起公告調整數，100 萬為條例明定金額</li>\n      <li>財政部臺北國稅局「計算居留天數」、「稅務居民身分及相關申報作業」；財政部稅務入口網外僑專區（始日不計末日計、護照章戳、累積計算、90/183 天申報義務）</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072\" target=\"_blank\" rel=\"noopener\">遺產及贈與稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>第 1 條（非國民僅就境內遺產課稅）、第 17 條（身分別扣除額之適用限制）</li>\n      <li>財政部：台灣生效所得稅協定清單（35 個生效協定）</li>\n      <li>法規查核日期：2026-07-05</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"overseas-income-750-myth.html\">海外所得 750 萬免稅？個人投資美股最常見的五個迷思</a></li>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"treasury-etf-estate-tax.html\">美國公債免遺產稅，但公債 ETF 要繳遺產稅：非居民投資人必須知道的重點差異</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "body_original": "<p>HBM 記憶體龍頭 SK 海力士（SK Hynix）2026 年 6 月 24 日董事會決議發行美國存託憑證（ADR），同日向 SEC 遞交 F-1（6 月 30 日補正），預計最快 7 月 10 日在 Nasdaq 掛牌，代碼 SKHY，1 股普通股拆為 10 單位 ADR，以新股發行募資、規模上看 USD 29B，若足額發行將超越 2014 年阿里巴巴，成為史上最大 ADR 發行案（發行條件與時程以公司最終公告為準）。</p>\n\n  <p>過去，美國投資人若要投資 SK 海力士，實務上多只能透過場外交易、流動性偏弱的無擔保（unsponsored）ADR 間接參與；雖然還是可以透過券商買韓國股票，但受時差、換匯的影響，便利度與流通性遠不如美股主板交易的股票。這次是正式在美國交易所掛牌。對台灣投資人來說，這是第一次可以在交易所買到有掛牌、有流動性的海力士 ADR。問題來了：<strong>該買 ADR，還是透過複委託直接買韓股（000660.KS）？繳的稅有差嗎？</strong></p>\n\n  <p>分析工具跟我在 <a href=\"tsm-adr-tax.html\">TSM ADR</a> 那篇用的完全一樣：先做發行人測試。SK 海力士是韓國公司，ADR 只是形式不同，發行人是韓國公司就決定了最終稅負。但這次多了一個台積電案例沒有的優勢：<strong>台韓租稅協定已經生效，而且多數人不知道。</strong></p>\n\n  <h2>股利扣繳稅：協定 10% vs 法定 22%</h2>\n\n  <p>韓國對非居住者股利的標準扣繳率是 22%。而台韓租稅協定自 2023 年 12 月 27 日生效、2024 年 1 月 1 日起適用，股利扣繳率降到 <strong>10%</strong>，是台灣第 35 個生效的所得稅協定。</p>\n\n  <p>台灣投資人領海力士股利，股利扣繳稅款差別：</p>\n\n  <ul>\n    <li><strong>複委託買韓股</strong>：韓國採事前申請制，需要透過券商與其韓國保管機構提交受益所有人文件。券商作業配合度決定你拿到 10% 還是 22%，下單前建議先問清楚。</li>\n    <li><strong>SKHY ADR</strong>：股利從海力士支付給存託機構再轉發給你在美國券商的戶頭。既然是先支付給存託機構，實務上就會先依照標準扣繳稅率 22% 扣稅，美國券商一般只處理美國稅務文件（W-8BEN 是給美國稅用的，跟韓國無關），不會替你主張台韓協定降低扣繳稅。理論上可以事後向韓國申請退稅，但對一般散戶來說要耗費相當多的時間和流程，通常就會放棄退稅。</li>\n  </ul>\n\n  <p>至於美國在配發海力士股利給台灣投資人，因為海力士股利不是美國來源所得，沒有美國預扣稅。這點與買一般美國公司股票（扣 30%）不同。</p>\n\n  <div class=\"callout\">值得思考的是，海力士股利政策偏保守，在經歷記憶體行情的股價大漲後，以目前股價計算的殖利率不到 0.5%，10% 與 22% 的扣繳稅差異相對於整體投報率每年大概也只差幾個 basis points，真正關鍵在遺產稅。</div>\n\n  <h2>資本利得稅</h2>\n\n  <ul>\n    <li><strong>韓國</strong>：外國投資人在韓國交易所出售上市股票，只要在出售當年及之前五年內任一時點持股都低於 25%，免繳所得稅。散戶透過複委託買賣韓股符合這個條件。如果是在那斯達克交易海力士 ADR，通常也不在韓國課稅範圍。</li>\n    <li><strong>台灣</strong>：不管是直接在韓國股市買海力士，或是在那斯達克買海力士 ADR，對台灣投資人來說，都算是海外所得，要計入個人基本所得額（最低稅負制）。針對「海外所得 750 萬免稅」的迷思我另外寫了一篇<a href=\"overseas-income-750-myth.html\">完整拆解</a>。</li>\n  </ul>\n\n  <p>另外有一個常被忽略的交易成本：在韓國交易所賣股要繳證券交易稅，2026 年 1 月 1 日起 KOSPI 掛牌股票賣出稅率調升為 0.20%。在那斯達克賣 ADR 就沒有這筆交易稅。</p>\n\n  <h2>遺產稅</h2>\n\n  <p><strong>美國</strong>：跟台積電 ADR 一樣，SKHY 代表的是韓國公司股票，一般見解不當成 US-situs 資產，不計入美國遺產稅（外國人有 USD 60,000 免稅額的問題，詳見<a href=\"us-estate-tax-60k.html\">美國遺產稅完整解析</a>）。</p>\n\n  <p><strong>韓國</strong>：這是很多人容易忽略的，韓國對非居民的韓國境內財產課遺產稅，韓國公司股票屬於境內財產，現行最高稅率 50%，且非居住者能用的扣除額遠比居民少。也就是說：</p>\n\n  <ul>\n    <li>透過複委託直接持有海力士（000660.KS）：是韓國遺產稅課稅範圍。</li>\n    <li>透過那斯達克持有海力士 ADR（SKHY）：ADR 表彰的股票是韓國股票，韓國稅法沒有明文把 ADR 認定為境外資產，存在不確定性。不能直接把 ADR 當成免韓國遺產稅。</li>\n    <li>台灣：台灣人的全球遺產都要課台灣的遺產稅，但國外已繳的遺產稅可回來抵稅，但韓國遺產稅最高 50% 遠超過台灣的最高遺產稅率 20%，抵不完的不能退稅，也就是實際要負擔最高 50% 遺產稅。</li>\n  </ul>\n\n  <p>簡單來說，高資產部位、長期持有、有傳承考量的人，持有韓國股票（不管是直接持有韓股或買韓國 ADR）的遺產稅相對於美股更需提前規劃。韓國近年有遺產稅改革討論下調稅率，但目前修法尚未通過，值得持續關注。</p>\n\n  <h2>表格整理</h2>\n\n  <table>\n    <tr><th>項目</th><th>複委託買韓股（000660.KS）</th><th>那斯達克買海力士 ADR</th></tr>\n    <tr><td>韓國扣繳稅</td><td>扣繳稅率 22%，可申請台韓協定降到 10%，需事前申請（需注意往來券商的配合意願）</td><td>實務上按照 22% 扣繳</td></tr>\n    <tr><td>美國扣繳稅</td><td>無</td><td>無</td></tr>\n    <tr><td>韓國資本利得稅</td><td>場內出售且持股 &lt;25%（含五年回溯）：免稅</td><td>那斯達克買賣：免稅</td></tr>\n    <tr><td>資本利得／股利：台灣</td><td colspan=\"2\" style=\"text-align:center;\">海外所得，計入基本所得額（最低稅負制）</td></tr>\n    <tr><td>交易稅</td><td>韓國證交稅 0.20%（2026 年起）</td><td>無</td></tr>\n    <tr><td>美國遺產稅</td><td>不適用</td><td>外國公司發行的 ADR，一般見解非 US-situs，不用繳納美國遺產稅</td></tr>\n    <tr><td>韓國遺產稅</td><td>最高 50%</td><td>無明文排除，存在不確定性</td></tr>\n    <tr><td>台灣遺產稅</td><td colspan=\"2\" style=\"text-align:center;\">全球財產計入遺產課稅；境外已繳遺產稅可依規定抵稅</td></tr>\n    <tr><td>其他持有成本</td><td>複委託手續費偏高、換匯成本</td><td>存託機構管理費（通常自股利中扣）、換匯成本</td></tr>\n  </table>\n\n  <h2>結論</h2>\n  <ol>\n    <li>在韓國的投資部位不大、圖方便、想和其他美股部位找同一家券商交易：ADR 是首選，股利扣繳稅的差異對低殖利率股來說影響不大。</li>\n    <li>在意股利扣繳稅、券商能配合申請租稅協定：複委託韓國股票有機會把扣繳稅從 22% 降到 10%。</li>\n    <li>在韓國的投資部位很高或有財富傳承考量：需事先規劃高達 50% 的韓國遺產稅。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人投資者為準，法規基準日 2026-07-04。SKHY 發行條件（掛牌日、發行規模、ADR 比率）以 SK Hynix 最終公告為準。韓國扣繳與退稅實務、複委託券商的協定申請作業各家不同，下單前請向券商確認。韓國遺產稅對境外 DR 的定性、以及大額部位的跨境遺產稅規劃，請個案諮詢韓國與台灣的稅務專業人員。</div>\n\n  <p>📺 本文有同主題短影音（46 秒重點版）：<a href=\"https://www.youtube.com/shorts/aEcN_MVTZ1c\" target=\"_blank\" rel=\"noopener\">台灣人買 ADR 還是韓股？稅差天差地遠</a>，更多影片在 <a href=\"https://www.youtube.com/@TaxCodeUSStocks\" target=\"_blank\" rel=\"noopener\">YouTube 頻道</a>。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20sk-hynix-adr-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li>SK Hynix 董事會決議（2026-06-24）；SEC EDGAR：<a href=\"https://www.sec.gov/Archives/edgar/data/2120882/000119312526280172/d32785df1.htm\" target=\"_blank\" rel=\"noopener\">Form F-1<span class=\"sr-only\">（於新分頁開啟）</span></a>（2026-06-24 遞交、06-30 修正）、<a href=\"https://www.sec.gov/Archives/edgar/data/2120882/000119380526000898/e665622_f6-skhynix.htm\" target=\"_blank\" rel=\"noopener\">Form F-6<span class=\"sr-only\">（於新分頁開啟）</span></a>（ADS 比率 1:10，存託機構 Citibank）；CNBC、Reuters 等媒體報導（Nasdaq ADR 發行、代碼 SKHY、規模上看 USD 29B）</li>\n      <li>財政部新聞稿：台韓所得稅協定 2023-12-27 生效、2024-01-01 適用，股利/利息/權利金扣繳上限 10%</li>\n      <li>韓國所得稅法：非居住者股利扣繳 22%（含地方稅）；非居住者場內出售上市股票持股未達 25% 免稅（<a href=\"https://taxsummaries.pwc.com/republic-of-korea\" target=\"_blank\" rel=\"noopener\">PwC Worldwide Tax Summaries, Korea<span class=\"sr-only\">（於新分頁開啟）</span></a>）</li>\n      <li>韓國企劃財政部：證券交易稅調整，2026-01-01 起 KOSPI 賣出合計 0.20%</li>\n      <li>韓國遺產稅（相續稅）：非居住者就韓國境內財產課稅，累進稅率最高 50%</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股票 situs 以發行公司為準）；<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072\" target=\"_blank\" rel=\"noopener\">台灣遺產及贈與稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（境外已納稅額扣抵）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見或投資建議。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>HBM 記憶體龍頭 SK 海力士（SK Hynix）2026 年 6 月 24 日董事會決議發行美國存託憑證（ADR），同日向 SEC 遞交 F-1（6 月 30 日補正），預計最快 7 月 10 日在 Nasdaq 掛牌，代碼 SKHY，1 股普通股拆為 10 單位 ADR，以新股發行募資、規模上看 USD 29B，若足額發行將超越 2014 年阿里巴巴，成為史上最大 ADR 發行案（發行條件與時程以公司最終公告為準）。</p>\n\n  <p>過去，美國投資人若要投資 SK 海力士，實務上多只能透過場外交易、流動性偏弱的無擔保（unsponsored）ADR 間接參與；雖然還是可以透過券商買韓國股票，但受時差、換匯的影響，便利度與流通性遠不如美股主板交易的股票。這次是正式在美國交易所掛牌。對台灣投資人來說，這是第一次可以在交易所買到有掛牌、有流動性的海力士 ADR。買 ADR 與透過複委託直接買韓股（000660.KS），稅負並不相同。</p>\n\n  <p>分析工具跟我在 <a href=\"tsm-adr-tax.html\">TSM ADR</a> 那篇用的完全一樣：先做發行人測試。SK 海力士是韓國公司，ADR 只是形式不同（亦即表彰的仍是韓國公司股票），發行人是韓國公司就決定了美國端的稅負結論。惟這次多了一個台積電案例沒有的條件：<strong>台韓租稅協定已經生效</strong>，多數人沒把它算進去。</p>\n\n  <h2>股利扣繳稅：協定 10% vs 法定 22%</h2>\n\n  <p>韓國對非居住者股利的標準扣繳率是 22%。而台韓租稅協定自 2023 年 12 月 27 日生效、2024 年 1 月 1 日起適用，股利扣繳率降到 10%，是台灣第 35 個生效的所得稅協定。</p>\n\n  <p>台灣投資人領海力士股利，股利扣繳稅款差別：</p>\n\n  <ul>\n    <li>複委託買韓股：韓國採事前申請制，需要透過券商與其韓國保管機構提交受益所有人文件。券商作業配合度決定你拿到 10% 還是 22%，下單前建議先問清楚。</li>\n    <li>SKHY ADR：股利從海力士支付給存託機構再轉發給你在美國券商的戶頭。既然是先支付給存託機構，實務上就會先依照標準扣繳稅率 22% 扣稅，美國券商一般只處理美國稅務文件（W-8BEN 是給美國稅用的，跟韓國無關），不會替你主張台韓協定降低扣繳稅。理論上可以事後向韓國申請退稅，但對一般散戶來說要耗費相當多的時間和流程，通常就會放棄退稅。</li>\n  </ul>\n\n  <p>至於美國在配發海力士股利給台灣投資人，因為海力士股利不是美國來源所得，沒有美國預扣稅。這點與買一般美國公司股票（扣 30%）不同。</p>\n\n  <div class=\"callout\">此亦可由另一角度分析：海力士股利政策偏保守，在經歷記憶體行情的股價大漲後，以目前股價計算的殖利率不到 0.5%，10% 與 22% 的扣繳差乘上這段殖利率，每年大概也只差幾個 basis points（因為股利佔報酬的比重本來就低，非因為稅率差距不存在）。真正關鍵在遺產稅。</div>\n\n  <h2>資本利得稅</h2>\n\n  <ul>\n    <li>韓國：外國投資人在韓國交易所出售上市股票，只要在出售當年及之前五年內任一時點持股都低於 25%，免繳所得稅。散戶透過複委託買賣韓股符合這個條件。如果是在那斯達克交易海力士 ADR，通常也不在韓國課稅範圍。</li>\n    <li>台灣：不管是直接在韓國股市買海力士，或是在那斯達克買海力士 ADR，對台灣投資人來說，都算是海外所得，要計入個人基本所得額（最低稅負制）。針對「海外所得 750 萬免稅」的迷思，另見<a href=\"overseas-income-750-myth.html\">海外所得最低稅負制說明</a>。</li>\n  </ul>\n\n  <p>另外有一個常被忽略的交易成本：在韓國交易所賣股要繳證券交易稅，2026 年 1 月 1 日起 KOSPI 掛牌股票賣出稅率調升為 0.20%。在那斯達克賣 ADR 就沒有這筆交易稅。</p>\n\n  <h2>遺產稅</h2>\n\n  <p>美國端跟台積電 ADR 一樣，SKHY 代表的是韓國公司股票，一般見解不當成 US-situs 資產，不計入美國遺產稅（外國人有 USD 60,000 免稅額的問題，詳見<a href=\"us-estate-tax-60k.html\">美國遺產稅完整解析</a>）。</p>\n\n  <p>韓國端才是容易忽略的部分。韓國對非居民的韓國境內財產課遺產稅，韓國公司股票屬於境內財產，現行最高稅率 50%，且非居住者能用的扣除額遠比居民少。ADR 掛在那斯達克，就能當成境外資產、避開韓國遺產稅？不能。雖 ADR 在美國交易所交易，但由於表彰的仍是韓國公司股票、韓國稅法又沒有明文把 ADR 認定為境外資產，故不能直接把 ADR 當成免韓國遺產稅。</p>\n\n  <ul>\n    <li>透過複委託直接持有海力士（000660.KS）：是韓國遺產稅課稅範圍。</li>\n    <li>透過那斯達克持有海力士 ADR（SKHY）：ADR 表彰的股票是韓國股票，韓國稅法沒有明文把 ADR 認定為境外資產，存在不確定性。不能直接把 ADR 當成免韓國遺產稅。</li>\n    <li>台灣：台灣人的全球遺產都要課台灣的遺產稅，但國外已繳的遺產稅可回來抵稅，但韓國遺產稅最高 50% 遠超過台灣的最高遺產稅率 20%，抵不完的不能退稅，也就是實際要負擔最高 50% 遺產稅。</li>\n  </ul>\n\n  <p>爰此，不能把那斯達克掛牌當成韓國遺產稅的排除條款。綜合以上，高資產部位、長期持有、有傳承考量的人，持有韓國股票（不管是直接持有韓股或買韓國 ADR）的遺產稅相對於美股更需提前規劃。韓國近年有遺產稅改革討論下調稅率，但目前修法尚未通過，值得持續關注。</p>\n\n  <h2>表格整理</h2>\n\n  <table>\n    <tr><th>項目</th><th>複委託買韓股（000660.KS）</th><th>那斯達克買海力士 ADR</th></tr>\n    <tr><td>韓國扣繳稅</td><td>扣繳稅率 22%，可申請台韓協定降到 10%，需事前申請（需注意往來券商的配合意願）</td><td>實務上按照 22% 扣繳</td></tr>\n    <tr><td>美國扣繳稅</td><td>無</td><td>無</td></tr>\n    <tr><td>韓國資本利得稅</td><td>場內出售且持股 &lt;25%（含五年回溯）：免稅</td><td>那斯達克買賣：免稅</td></tr>\n    <tr><td>資本利得／股利：台灣</td><td colspan=\"2\" style=\"text-align:center;\">海外所得，計入基本所得額（最低稅負制）</td></tr>\n    <tr><td>交易稅</td><td>韓國證交稅 0.20%（2026 年起）</td><td>無</td></tr>\n    <tr><td>美國遺產稅</td><td>不適用</td><td>外國公司發行的 ADR，一般見解非 US-situs，不用繳納美國遺產稅</td></tr>\n    <tr><td>韓國遺產稅</td><td>最高 50%</td><td>無明文排除，存在不確定性</td></tr>\n    <tr><td>台灣遺產稅</td><td colspan=\"2\" style=\"text-align:center;\">全球財產計入遺產課稅；境外已繳遺產稅可依規定抵稅</td></tr>\n    <tr><td>其他持有成本</td><td>複委託手續費偏高、換匯成本</td><td>存託機構管理費（通常自股利中扣）、換匯成本</td></tr>\n  </table>\n\n  <h2>結論</h2>\n  <ol>\n    <li>在韓國的投資部位不大、圖方便、想和其他美股部位找同一家券商交易：ADR 是首選，股利扣繳稅的差異對低殖利率股來說影響不大。</li>\n    <li>在意股利扣繳稅、券商能配合申請租稅協定：複委託韓國股票有機會把扣繳稅從 22% 降到 10%。</li>\n    <li>在韓國的投資部位很高或有財富傳承考量：需事先規劃高達 50% 的韓國遺產稅。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人投資者為準，法規基準日 2026-07-04。SKHY 發行條件（掛牌日、發行規模、ADR 比率）以 SK Hynix 最終公告為準。韓國扣繳與退稅實務、複委託券商的協定申請作業各家不同，下單前請向券商確認。韓國遺產稅對境外 DR 的定性、以及大額部位的跨境遺產稅規劃，請個案諮詢韓國與台灣的稅務專業人員。</div>\n\n  <p>📺 本文有同主題短影音（46 秒重點版）：<a href=\"https://www.youtube.com/shorts/aEcN_MVTZ1c\" target=\"_blank\" rel=\"noopener\">台灣人買 ADR 還是韓股？稅差天差地遠</a>，更多影片在 <a href=\"https://www.youtube.com/@TaxCodeUSStocks\" target=\"_blank\" rel=\"noopener\">YouTube 頻道</a>。</p>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20sk-hynix-adr-tax\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li>SK Hynix 董事會決議（2026-06-24）；SEC EDGAR：<a href=\"https://www.sec.gov/Archives/edgar/data/2120882/000119312526280172/d32785df1.htm\" target=\"_blank\" rel=\"noopener\">Form F-1<span class=\"sr-only\">（於新分頁開啟）</span></a>（2026-06-24 遞交、06-30 修正）、<a href=\"https://www.sec.gov/Archives/edgar/data/2120882/000119380526000898/e665622_f6-skhynix.htm\" target=\"_blank\" rel=\"noopener\">Form F-6<span class=\"sr-only\">（於新分頁開啟）</span></a>（ADS 比率 1:10，存託機構 Citibank）；CNBC、Reuters 等媒體報導（Nasdaq ADR 發行、代碼 SKHY、規模上看 USD 29B）</li>\n      <li>財政部新聞稿：台韓所得稅協定 2023-12-27 生效、2024-01-01 適用，股利/利息/權利金扣繳上限 10%</li>\n      <li>韓國所得稅法：非居住者股利扣繳 22%（含地方稅）；非居住者場內出售上市股票持股未達 25% 免稅（<a href=\"https://taxsummaries.pwc.com/republic-of-korea\" target=\"_blank\" rel=\"noopener\">PwC Worldwide Tax Summaries, Korea<span class=\"sr-only\">（於新分頁開啟）</span></a>）</li>\n      <li>韓國企劃財政部：證券交易稅調整，2026-01-01 起 KOSPI 賣出合計 0.20%</li>\n      <li>韓國遺產稅（相續稅）：非居住者就韓國境內財產課稅，累進稅率最高 50%</li>\n      <li><a href=\"https://www.law.cornell.edu/uscode/text/26/2104\" target=\"_blank\" rel=\"noopener\">IRC §2104(a)<span class=\"sr-only\">（於新分頁開啟）</span></a>（股票 situs 以發行公司為準）；<a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072\" target=\"_blank\" rel=\"noopener\">台灣遺產及贈與稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（境外已納稅額扣抵）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見或投資建議。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "body_original": "<p>投資社團裡常聽人說：『海外所得 750 萬以下免稅』，這句話其實混淆了三個截然不同的概念，實務上很容易導致多繳稅或漏申報的狀況。以下從最低稅負制的運作出發，透過具體的計算範例來釐清大家最常混淆的五個稅務迷思。</p>\n\n  <h2>先花 60 秒看懂制度</h2>\n\n  <p>台灣個人的海外所得（非中華民國來源所得，含配息、資本利得）不併入綜合所得稅，而是透過「最低稅負制」課徵：</p>\n\n  <ol>\n    <li><strong>基本所得額</strong> ＝ 綜合所得淨額 ＋ 海外所得（每一家庭成員合計全年達 100 萬才計入）＋ 特定保險給付（受益人與要保人非同一人的人壽及年金保險：死亡給付超過 3,740 萬部分計入，滿期金、年金等非死亡給付全額計入；施行前訂立的舊保單不計入）＋ 未上市櫃股票交易所得 ＋ 非現金捐贈扣除額 ＋ 其他 2006 年條例施行後新頒法律減免、經財政部公告應計入的項目（如天使投資人租稅優惠，與一般投資人無關）</li>\n    <li><strong>基本稅額</strong> ＝（基本所得額 − 750 萬）× 20%</li>\n    <li><strong>比較</strong>：基本稅額 &gt; 一般綜所稅額時，只補繳差額；反之則無須繳納，實質等同海外所得免稅</li>\n  </ol>\n\n  <p>750 萬與 3,740 萬是自 2024 年度（113 年度）起適用的調整後金額。</p>\n\n  <h2>迷思一：「750 萬是海外所得的免稅額」</h2>\n\n  <p>這句話的盲點在於，750 萬扣除額是從『基本所得額』中扣除，而基本所得額的計算起點，是你的個人綜合所得淨額。換句話說，當你的國內薪資所得越高，這 750 萬的免稅空間就會被吃掉越多，能留給海外所得的扣除額度就跟著減少。因此，同樣 500 萬的海外所得，一位高薪的竹科工程師與一位沒有薪資所得的退休族，在最低稅負制底下的計算起點就不同。</p>\n\n  <div class=\"callout warn\"><strong>常見錯誤提醒</strong>：很多人常誤以為基本所得額就等於海外所得，這也是實務上最普遍的計算錯誤。其實除了海外所得，基本所得額還包含其他特定項目，像是 2006 年後買的受益人與要保人非屬同一人的人壽及年金保險死亡給付中，超過新台幣 3,000 萬元（目前隨物價調整為 3,740 萬）的部分，以及未上市櫃股票交易所得、非現金捐贈等。因此在估算自己有多少 750 萬的免稅空間時，必須把這些項目全部合併納入計算。</div>\n\n  <h2>迷思二：「海外所得 100 萬以下不用管，超過 100 萬才開始繳稅」</h2>\n\n  <p>這個 100 萬的門檻在稅法上是屬於計入門檻（也就是只要未達 100 萬就完全不計入，但一旦達到 100 萬，則是全額計入基本所得額）。舉例來說，當海外所得為 99 萬時，計入的金額為 0；但如果增加到 100 萬，計入的金額就會直接變成 100 萬，僅僅 1 萬元的差距就會造成基本所得額在計算上產生 100 萬元的落差。</p>\n\n  <p>在申報實務上，我們需要特別注意三個關鍵點：首先，這個計入門檻是以『申報戶』為單位合計（包含夫妻以及受扶養親屬的海外所得都要合併計算）；其次，課稅範圍同時包含海外配息、已實現的資本利得，以及基金贖回的獲利；最後，課稅是以『已實現』為認定基準（也就是說未實現的帳面獲利是不課稅的）。</p>\n\n  <h2>迷思三：「基本所得額超過 750 萬，超過部分就要繳 20%」</h2>\n\n  <p>很多人在計算時往往忽略了與一般綜所稅『比大小』的步驟。基本稅額計算出來後，必須與一般綜所稅額進行比較，只有當基本稅額大於一般綜所稅額時，才需要補繳其中的差額。這在實務上會導致一個反直覺的現象：平常綜合所得稅繳得越多、適用稅率越高的人，海外所得的免稅額度會越高。</p>\n\n  <table>\n    <tr><th>情境</th><th>上班族 A</th><th>退休族 B</th></tr>\n    <tr><td>綜合所得淨額</td><td>400 萬</td><td>50 萬</td></tr>\n    <tr><td>一般綜所稅額（依 115 年度級距概算）</td><td>約 77 萬</td><td>約 2.5 萬</td></tr>\n    <tr><td>海外所得（已實現）</td><td>500 萬</td><td>900 萬</td></tr>\n    <tr><td>基本所得額</td><td>900 萬</td><td>950 萬</td></tr>\n    <tr><td>基本稅額 =（基本所得額 − 750 萬）× 20%</td><td>30 萬</td><td>40 萬</td></tr>\n    <tr><td>比較結果</td><td>30 萬 &lt; 77 萬，補繳 0</td><td>40 萬 &gt; 2.5 萬，補繳 37.5 萬</td></tr>\n  </table>\n\n  <p>從上面的試算可以看出，雖然上班族 A 的總所得比退休族 B 還要高，但最終卻不需要繳最低稅負；相反地，退休族 B 因為一般綜所稅額較低，導致海外所得很容易就需繳稅。因此，『750 萬以下免稅』這個說法，對於國內所得高的 A 來說顯得過於保守（他其實就算基本所得額遠高於 750 萬也未必需要補稅），但對於國內所得低的 B 來說卻又太過樂觀。特別是那些退休後主要依靠海外投資部位提領生活費的族群，通常就須就海外所得納稅。</p>\n\n  <h2>迷思四：「美國已經扣我 30% 股利所得稅，台灣不會再課」</h2>\n\n  <p>這個理解方向雖然沒錯，但在稽徵實務上並不是自動生效。海外已繳稅款雖然可以用來扣抵台灣的稅款，但必須滿足兩個前提條件：首先，扣抵金額不能超過『因為加計該筆海外所得而增加的基本稅額』；其次，法規上要求必須檢附所得來源地稅務機關發給的同年度納稅憑證等證明文件（在美股投資的實務中，目前多數稽徵機關可能會接受以券商提供的 1042-S 表單作為佐證，不過稅局仍可能要求提供其他額外證明文件）。</p>\n\n  <p>在絕大多數情況下，因為美國扣繳的 30% 稅率通常高於台灣應繳稅款額（畢竟台灣的最低稅負稅率就 20%），所以在扣抵之後，台灣通常不需要再補繳稅款。再次提醒兩個關鍵：第一，海外已納稅額扣抵僅限於抵稅，不能退稅（在美國多繳的稅，台灣國稅局不會退給你）；第二，即使扣抵後不用在台灣繳稅，也不代表就能免除申報義務（這點我們在迷思五會詳細說明）。最後特別提醒，台股 ADR 的 21% 扣繳是台灣的扣繳稅款、不是海外稅款（參見 <a href=\"tsm-adr-tax.html\">TSM ADR</a> 一文），不可混淆。</p>\n\n  <h2>迷思五：「反正沒超過門檻就不用申報」＋「賠錢可以抵稅」</h2>\n\n  <p>當家庭申報戶基本所得額在 750 萬以下時，確實是免申報也免繳納；但只要基本所得額超過 750 萬，依法就必須填寫基本稅額申報表進行申報，即便最終要繳的金額為 0，也有申報義務。如果漏報又被國稅局查獲，將會面臨補稅加處罰鍰。特別是近年來國稅局除了能掌握複委託券商的申報資料外，也持續透過 CRS 帳戶資訊自動交換（目前已與日本、澳洲、英國等協定國交換非美國帳戶資訊）等多元管道來提高對海外所得的掌握度，因此建議讀者在申報上不要抱持僥倖心理。</p>\n\n  <p>至於投資虧損的部分，海外財產交易損失目前僅限於扣抵『同年度』的海外財產交易所得，既不能跨年度遞延，也無法用來折抵海外配息等其他種類的所得。因此，今年的虧損不能抵明年的獲利。但這也表示，在同一個年度內適度安排盈虧互抵（也就是在年底前實現相對應的獲利），是調整海外投資部位時少數合法且有效的稅務規劃手段。</p>\n\n  <div class=\"callout\">在實務上，成本舉證是一個經常被投資人忽略的議題。當賣出海外有價證券卻無法提出原始取得成本證明時，國稅局將會依照成交價格的 20% 來設算財產交易所得（若是稽徵機關後續查得實際成本，則會依法從其實際成本計算）。因此建議長期投資人務必要保留完整的買賣對帳單，特別是遇到券商轉換平台或是遺產繼承來的部位，常發生無法舉證成本的情況。</div>\n\n  <h2>檢查清單</h2>\n\n  <table>\n    <tr><th>狀況</th><th>要做的事</th></tr>\n    <tr><td>全戶海外所得 &lt; 100 萬</td><td>不計入、不申報（但保留紀錄）</td></tr>\n    <tr><td>海外所得 ≥ 100 萬，基本所得額 ≤ 750 萬</td><td>免申報免繳納</td></tr>\n    <tr><td>基本所得額 &gt; 750 萬</td><td>應申報基本稅額，是否補繳看與綜所稅的比較結果；有境外納稅證明記得附上扣抵憑證</td></tr>\n    <tr><td>當年度有實現虧損</td><td>檢查同年度有無可互抵的海外財產交易所得，跨年無法抵扣</td></tr>\n  </table>\n\n  <p>最後補充三個常見的觀念：個人海外所得不用繳二代健保補充保費；大陸地區來源所得不是海外所得（依法併入綜合所得稅），港澳來源所得算海外所得；「海外券商 vs 複委託」的稅務影響相同。</p>\n\n  <h2>結論</h2>\n  <ol>\n    <li>我們常聽到的『750 萬以下免稅』，更精確地說：『當申報戶的年度基本所得額（包含國內所得與特定免稅項目）在 750 萬以下時，才免予申報基本稅額；超過的話，補不補稅還要跟綜所稅比大小。』</li>\n    <li>在門檻認定上，100 萬元是全戶全年的門檻，達標全額計入；已實現才列入計算。</li>\n    <li>此外，繳高額國內綜合所得稅的高收入族群，會享有更高的海外所得免稅空間；相反地，國內所得偏低的退休族，反而是最低稅負制最主要的課稅對象，兩者的稅務規劃策略是截然不同的。</li>\n    <li>最後要記住，美國扣繳雖然可以回台扣抵，但要保留相關憑證。這些在實務計算上的細節，直接決定了海外資產在稅務上的最終成本。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人為準，金額為 113 年度（2024）起適用的公告調整數，法規基準日 2026-07-04，未來隨物價指數可能再調整。綜所稅額為依現行級距之概算，實際依個人免稅額與扣除額而定。CFC（受控外國企業）規則下的境外公司架構、信託架構、非現金捐贈等特殊情境不在本文範圍。個案請諮詢合格稅務專業人員。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20overseas-income-750-myth\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340115\" target=\"_blank\" rel=\"noopener\">所得基本稅額條例<span class=\"sr-only\">（於新分頁開啟）</span></a> §3、§5（申報門檻）、§12（個人基本所得額計入項目，海外所得 100 萬門檻）、§13（扣除額、20% 稅率、海外已納稅額扣抵上限）</li>\n      <li>財政部公告（台財稅字第 11204674390 號，2023-11-23）：113 年度起個人基本所得額扣除額調為 750 萬元、保險死亡給付免計入額度調為 3,740 萬元；115 年度經公告維持不變（2025-11-27）</li>\n      <li>財政部稅務入口網：個人海外所得課徵基本稅額相關規定（有價證券無法提示成本按成交價 20% 計算所得、海外財產交易損失限同年度扣除）</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003\" target=\"_blank\" rel=\"noopener\">所得稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（綜合所得稅課稅級距，概算用）；全民健康保險扣取及繳納補充保險費辦法（費基不含海外所得）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"foreigner-taiwan-tax-resident.html\">外國人在台灣：住滿 183 天成為稅務居民，境外投資損益怎麼課稅</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>投資社團裡常聽人說「海外所得 750 萬以下免稅」，這句話混淆了三個截然不同的概念，實務上很容易導致多繳稅或漏申報。以下從最低稅負制的規則本質出發，辨認適用項目，再以計算例對照五個最常見的誤解。</p>\n\n  <h2>最低稅負制怎麼運作</h2>\n\n  <p>台灣個人的海外所得（非中華民國來源所得，含配息、資本利得）不併入綜合所得稅，而是透過最低稅負制課徵：</p>\n\n  <ol>\n    <li><strong>基本所得額</strong> ＝ 綜合所得淨額 ＋ 海外所得（每一家庭成員合計全年達 100 萬才計入）＋ 特定保險給付（受益人與要保人非同一人的人壽及年金保險：死亡給付超過 3,740 萬部分計入，滿期金、年金等非死亡給付全額計入；施行前訂立的舊保單不計入）＋ 未上市櫃股票交易所得 ＋ 非現金捐贈扣除額 ＋ 其他 2006 年條例施行後新頒法律減免、經財政部公告應計入的項目（如天使投資人租稅優惠，與一般投資人無關）</li>\n    <li>基本稅額 ＝（基本所得額 − 750 萬）× 20%</li>\n    <li>比較：基本稅額 &gt; 一般綜所稅額時，只補繳差額；反之則無須繳納，實質等同海外所得免稅</li>\n  </ol>\n\n  <p>750 萬與 3,740 萬是自 2024 年度（113 年度）起適用的調整後金額。</p>\n\n  <h2>750 萬扣除額扣的是基本所得額</h2>\n\n  <p>把 750 萬當成海外所得免稅額，盲點在於扣除的對象選錯了：750 萬是從基本所得額中扣除，而基本所得額的計算起點是你的綜合所得淨額（亦即你的國內薪資越高，這 750 萬被吃掉越多，能留給海外所得的空間就越小）。故同樣 500 萬的海外所得，一位高薪的竹科工程師與一位沒有薪資所得的退休族，在最低稅負制底下的計算起點就不同。</p>\n\n  <div class=\"callout warn\"><strong>常見錯誤提醒</strong>：很多人把基本所得額當成海外所得，這是實務上最普遍的計算錯誤。除了海外所得，基本所得額還包含其他特定項目，像是 2006 年後買的、受益人與要保人非屬同一人的人壽及年金保險死亡給付中，超過新台幣 3,000 萬元（目前隨物價調整為 3,740 萬）的部分，以及未上市櫃股票交易所得、非現金捐贈等。估算自己還有多少 750 萬空間時，必須把這些項目全部合併納入計算。</div>\n\n  <h2>100 萬是計入門檻，達標即全額計入</h2>\n\n  <p>這個 100 萬在稅法上是計入門檻：未達 100 萬完全不計入，一旦達到 100 萬，則全額計入基本所得額。海外所得 99 萬時，計入金額為 0；增加到 100 萬，計入金額就直接變成 100 萬。99 萬與 100 萬只差 1 萬，計入金額怎麼會差 100 萬？因為這不是起徵點（達標後只就超過部分課稅），是全額計入的門檻。</p>\n\n  <p>申報實務上有三件事必須一起看：計入門檻以申報戶為單位合計（夫妻以及受扶養親屬的海外所得都要合併）；課稅範圍同時包含海外配息、已實現的資本利得，以及基金贖回的獲利；認定基準是已實現（亦即未實現的帳面獲利不課稅）。</p>\n\n  <h2>基本稅額還須與綜所稅比大小</h2>\n\n  <p>雖基本稅額是用（基本所得額 − 750 萬）× 20% 算出來的，但由於算出後必須與一般綜所稅額比大小，只有基本稅額較大時才補繳差額，故綜所稅繳得越多、適用稅率越高的人，海外所得能被「吃進去」的額度反而越高。</p>\n\n  <table>\n    <tr><th>情境</th><th>上班族 A</th><th>退休族 B</th></tr>\n    <tr><td>綜合所得淨額</td><td>400 萬</td><td>50 萬</td></tr>\n    <tr><td>一般綜所稅額（依 115 年度級距概算）</td><td>約 77 萬</td><td>約 2.5 萬</td></tr>\n    <tr><td>海外所得（已實現）</td><td>500 萬</td><td>900 萬</td></tr>\n    <tr><td>基本所得額</td><td>900 萬</td><td>950 萬</td></tr>\n    <tr><td>基本稅額 =（基本所得額 − 750 萬）× 20%</td><td>30 萬</td><td>40 萬</td></tr>\n    <tr><td>比較結果</td><td>30 萬 &lt; 77 萬，補繳 0</td><td>40 萬 &gt; 2.5 萬，補繳 37.5 萬</td></tr>\n  </table>\n\n  <p>此亦可由另一角度分析。A 的基本所得額 900 萬已超過 750 萬，基本稅額 30 萬，然其綜所稅約 77 萬，比大小後補繳為 0；B 的基本所得額 950 萬只比 A 多 50 萬，基本稅額 40 萬，惟綜所稅僅約 2.5 萬，故須補 37.5 萬。同一套公式，國內所得高低才是有沒有補稅的分母。「750 萬以下免稅」對國內所得高的 A 過於保守（基本所得額遠高於 750 萬也未必補稅），對國內所得低的 B 又過於樂觀；退休後主要依靠海外投資部位提領生活費的人，通常就須就海外所得納稅。</p>\n\n  <h2>美國已扣 30% 不能自動免除台灣申報</h2>\n\n  <p>海外已繳稅款可以用來扣抵台灣的稅，但不是自動生效，必須滿足兩個前提：扣抵金額不能超過「因為加計該筆海外所得而增加的基本稅額」；法規要求檢附所得來源地稅務機關發給的同年度納稅憑證等證明文件（美股扣繳實務多以券商 1042-S 佐證，惟稽徵機關得要求補正）。</p>\n\n  <p>絕大多數情況下，美國扣繳的 30% 高於台灣最低稅負的 20%，扣抵之後台灣無須再補稅。惟扣抵僅限於抵稅，不能退稅（在美國多繳的稅，台灣國稅局不會退給你）；即使扣抵後不用在台灣繳稅，也不等於免除申報義務。另須辨認：台股 ADR 的 21% 扣繳是台灣的扣繳稅款、不是海外稅款（參見 <a href=\"tsm-adr-tax.html\">TSM ADR</a> 一文），不可混淆。</p>\n\n  <h2>超過 750 萬即有申報義務，虧損也不能跨年抵</h2>\n\n  <p>家庭申報戶基本所得額在 750 萬以下時，確實免申報也免繳納；但只要基本所得額超過 750 萬，依法就必須填寫基本稅額申報表，即便最終要繳的金額為 0，也有申報義務（因為申報義務看基本所得額，非看補稅金額）。漏報被查獲即補稅加處罰鍰。國稅局除了能掌握複委託券商的申報資料外，也持續透過 CRS 帳戶資訊自動交換（目前已與日本、澳洲、英國等協定國交換非美國帳戶資訊）提高對海外所得的掌握度，沒有僥倖空間。</p>\n\n  <p>至於投資虧損，海外財產交易損失目前僅限於扣抵同年度的海外財產交易所得，既不能跨年度遞延，也無法用來折抵海外配息等其他種類的所得（亦即今年的虧損不能抵明年的獲利）。爰此，在同一個年度內安排盈虧互抵（年底前實現相對應的獲利），是調整海外投資部位時少數合法且有效的規劃手段。</p>\n\n  <div class=\"callout\">成本舉證是一個經常被忽略的議題。當賣出海外有價證券卻無法提出原始取得成本證明時，國稅局將會依照成交價格的 20% 來設算財產交易所得（若稽徵機關後續查得實際成本，則依法從其實際成本計算）。長期投資人必須保留完整的買賣對帳單，特別是券商轉換平台或遺產繼承來的部位，常發生無法舉證成本的情況。</div>\n\n  <h2>檢查清單</h2>\n\n  <table>\n    <tr><th>狀況</th><th>要做的事</th></tr>\n    <tr><td>全戶海外所得 &lt; 100 萬</td><td>不計入、不申報（但保留紀錄）</td></tr>\n    <tr><td>海外所得 ≥ 100 萬，基本所得額 ≤ 750 萬</td><td>免申報免繳納</td></tr>\n    <tr><td>基本所得額 &gt; 750 萬</td><td>應申報基本稅額，是否補繳看與綜所稅的比較結果；有境外納稅證明記得附上扣抵憑證</td></tr>\n    <tr><td>當年度有實現虧損</td><td>檢查同年度有無可互抵的海外財產交易所得，跨年無法抵扣</td></tr>\n  </table>\n\n  <p>最後補充三個常見的觀念：個人海外所得不用繳二代健保補充保費；大陸地區來源所得不是海外所得（依法併入綜合所得稅），港澳來源所得算海外所得；海外券商與複委託的稅務影響相同。</p>\n\n  <h2>結論</h2>\n  <ol>\n    <li>「750 萬以下免稅」精確的說法是：當申報戶的年度基本所得額（包含國內所得與特定免稅項目）在 750 萬以下時，才免予申報基本稅額；超過的話，補不補稅還要跟綜所稅比大小。</li>\n    <li>100 萬元是全戶全年的計入門檻，達標全額計入；已實現才列入計算。</li>\n    <li>繳高額國內綜合所得稅的人，海外所得能被吃進去的空間較大；國內所得偏低的退休族，反而是最低稅負制最主要的課稅對象，兩者的規劃策略截然不同。</li>\n    <li>綜合以上，美國扣繳可以回台扣抵，但要保留憑證；這些計算細節直接決定海外資產在稅務上的最終成本。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人為準，金額為 113 年度（2024）起適用的公告調整數，法規基準日 2026-07-04，未來隨物價指數可能再調整。綜所稅額為依現行級距之概算，實際依個人免稅額與扣除額而定。CFC（受控外國企業）規則下的境外公司架構、信託架構、非現金捐贈等特殊情境不在本文範圍。個案請諮詢合格稅務專業人員。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題或有不同看法，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20overseas-income-750-myth\">hello@taxcodeusstocks.com</a>。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340115\" target=\"_blank\" rel=\"noopener\">所得基本稅額條例<span class=\"sr-only\">（於新分頁開啟）</span></a> §3、§5（申報門檻）、§12（個人基本所得額計入項目，海外所得 100 萬門檻）、§13（扣除額、20% 稅率、海外已納稅額扣抵上限）</li>\n      <li>財政部公告（台財稅字第 11204674390 號，2023-11-23）：113 年度起個人基本所得額扣除額調為 750 萬元、保險死亡給付免計入額度調為 3,740 萬元；115 年度經公告維持不變（2025-11-27）</li>\n      <li>財政部稅務入口網：個人海外所得課徵基本稅額相關規定（有價證券無法提示成本按成交價 20% 計算所得、海外財產交易損失限同年度扣除）</li>\n      <li><a href=\"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003\" target=\"_blank\" rel=\"noopener\">所得稅法<span class=\"sr-only\">（於新分頁開啟）</span></a>（綜合所得稅課稅級距，概算用）；全民健康保險扣取及繳納補充保險費辦法（費基不含海外所得）</li>\n      <li>法規查核日期：2026-07-04</li>\n    </ul>\n  </div>\n\n  <div class=\"related\">\n    <h4>延伸閱讀</h4>\n    <ul>\n      <li><a href=\"tsm-adr-tax.html\">TSM ADR vs 2330：台灣投資人的稅務差異，多數人講錯的兩件事</a></li>\n      <li><a href=\"us-estate-tax-60k.html\">散戶買美股最容易忽略的稅務成本：美國遺產稅 USD 60,000 門檻完整說明</a></li>\n      <li><a href=\"foreigner-taiwan-tax-resident.html\">外國人在台灣：住滿 183 天成為稅務居民，境外投資損益怎麼課稅</a></li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "description_suggested": "全球最低稅上路後，VWRA、CSPX 等愛爾蘭 ETF 的基金層級稅制是否改變？規則把投資基金排除在外，真正影響在持股公司的有效稅率。",
      "issues": [

      "body_original": "<p>台灣投資人買愛爾蘭註冊 ETF（例如：VWRA、CSPX、VUAA，多數在倫敦交易所掛牌、基金註冊地在愛爾蘭），理由通常有三個：美國股利預扣稅從 30% 降到 15%、不用繳美國遺產稅、有累積型 ETF 不配息。</p>\n\n  <p>但是 OECD 全球最低稅制度上路了，新聞標題寫著「避稅天堂愛爾蘭被迫加稅到 15%」。於是大家都在問：<strong>註冊在愛爾蘭的 ETF，會不會也被課這個 15%？</strong></p>\n\n  <p>答案是：<strong>不會。規則設計上就把投資基金排除在外。</strong>這篇會進行詳細說明，你看完就知道為什麼可以放心，以及真正該注意的議題在哪裡。</p>\n\n  <h2>第一層：全球最低稅負制不抓 ETF</h2>\n\n  <p>全球最低稅負只適用於「跨國企業集團」（MNE Group）：合併財報營收達到 EUR 750M 門檻（前四個財務年度中至少兩年達標）、且至少有一個成員在母公司以外的國家。這裡有兩個常見誤解要先釐清：</p>\n\n  <ol>\n    <li><strong>ETF 的「規模大」不等於「營收大」。</strong>VWRA 這種基金資產規模（AUM）幾百億美元，但 AUM 不是營收，門檻看的是合併財報上的收入。</li>\n    <li><strong>更關鍵的是：ETF 沒有「合併報表」可言。</strong>基金持有幾千檔股票，但會計上是以公允價值列為投資，不會把 Apple、Microsoft 合併成子公司。沒有合併，就沒有 MNE Group，根本就不在課稅範圍內。</li>\n  </ol>\n\n  <p>從另一個面向，ETF 也不會被併進資產管理公司的合併報表。BlackRock 管理 iShares 的基金、Vanguard 管理 VWRA，但基金資產屬於投資人，不屬於資產管理公司，一般情況下不會出現在 BlackRock 的合併財報（例外是種子資金等管理人持有重大自有部位的階段，見文末假設說明）。</p>\n\n  <h2>第二層：就算列入課稅範圍，投資基金是明文排除實體</h2>\n\n  <p>即便某個基金真的構成集團最上層母公司，規則也把「投資基金」（Investment Fund）列為排除實體（Excluded Entity），也就是不在課稅範圍。</p>\n\n  <p>這不是漏洞，投資基金在各國稅制下的定位是「稅務中性導管」：基金層級不課稅或輕稅，課稅時點是投資人領到錢的時候。</p>\n\n  <h2>第三層：愛爾蘭本國稅法怎麼規定</h2>\n\n  <p>愛爾蘭以 Finance (No. 2) Act 2023 導入全球最低稅負制：所得納入規則（IIR）與國內補充稅（QDTT）適用於 2023 年 12 月 31 日以後開始的財務年度。這裡有個內行人才知道的秘辛：愛爾蘭的法令其實比歐盟法令更嚴，連沒有集團的獨立實體，自身營收超過 EUR 750M 也被納入課稅範圍。監管型投資基金（依愛爾蘭稅法定義，涵蓋 unit trust、ICAV、CCF、ILP，以及 VWRA、CSPX 這類 UCITS 投資公司 plc）是由 Finance Act 2024 明文排除在課稅範圍，前提是基金未被納入任何合併財報。</p>\n\n  <p>換句話說，愛爾蘭基金稅制的核心（基金層級不課稅、對非居民投資人不扣繳）在導入全球最低稅負制之後<strong>完全不受影響</strong>。</p>\n\n  <div class=\"callout\">為什麼大家會誤會？因為新聞說的「愛爾蘭同意 15%」，指的是對大型跨國集團公司加稅（原本公司稅率 12.5%）。Apple 愛爾蘭子公司的稅、與你持有的愛爾蘭 ETF 的稅，是兩套完全不同的制度。標題把「愛爾蘭」三個字混在一起，讀者就把公司稅的新聞解讀成基金稅的風險。</div>\n\n  <h2>那全球最低稅負制到底影響什麼？</h2>\n\n  <p>影響還是有的：你的 ETF 持有的那些公司，可能因此要多繳稅。</p>\n\n  <p>Apple、Microsoft、Alphabet 這些 ETF 前十大持股，全部都在課稅範圍內。過去依賴低稅法域壓低有效稅率（ETR）的空間已不存在：Apple FY2025 的 ETR 是 15.6%（FY2023 還在 14.7%，FY2024 因歐盟 State Aid 一次性稅費提高到 24.1%）；財報沒有「新常態」這三個字，這是我的判讀（完整拆解見 <a href=\"apple-etr.html\">Apple 的稅務密碼</a>）。公司稅後盈餘微幅下修，反映在 EPS 和股價上，這才是全球最低稅負真正影響到 ETF 投資人的方式：<strong>透過持股的獲利，不是透過基金被課稅。</strong></p>\n\n  <h2>整理</h2>\n\n  <table>\n    <tr><th>層級</th><th>導入全球最低稅負前</th><th>導入全球最低稅負後</th></tr>\n    <tr><td>底層持股公司（Apple 等）</td><td>可利用低稅國壓低 ETR</td><td>ETR 拉高到 15%，壓低稅後盈餘</td></tr>\n    <tr><td>基金層級：美國股利預扣稅</td><td>15%（美愛租稅協定）</td><td>15%，不變</td></tr>\n    <tr><td>基金層級：愛爾蘭稅</td><td>不課稅</td><td>不課稅，不變（排除投資基金）</td></tr>\n    <tr><td>投資人層級：愛爾蘭扣繳</td><td>對非居民 0</td><td>0，不變</td></tr>\n    <tr><td>投資人層級：美國遺產稅</td><td>非 US-situs，不計入</td><td>不變（詳見<a href=\"treasury-etf-estate-tax.html\">公債 ETF 遺產稅</a>一文的 situs 分析）</td></tr>\n    <tr><td>投資人層級：台灣稅</td><td>海外所得，計入基本所得額</td><td>不變（多數人誤解的「750 萬免稅」，另文<a href=\"overseas-income-750-myth.html\">完整拆解</a>）</td></tr>\n  </table>\n\n  <h2>結論</h2>\n  <ol>\n    <li>愛爾蘭 ETF 不會被課 15% 全球最低稅負。</li>\n    <li>買愛爾蘭 ETF 的三個稅務考量（15% 股利稅、非美國遺產稅資產、累積型）在全球最低稅負制實施後不受影響，不需要改變資產配置。</li>\n    <li>真正的影響在持股端：ETF 的投資公司 ETR 未來合理預期會提高，但不是擔心基金被課稅。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人、持有愛爾蘭註冊 UCITS ETF（公開募集、廣泛持有）的一般情境為準。若基金實體被納入某集團合併財報（例如集團自設的基金 SPV、種子資金階段的基金），適用性需個案判斷。各國落地法細節持續更新中，重大部位請以當時法令個案確認。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題、有不同看法，或想指定下一個拆解主題，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20irish-etf-pillar-two\">hello@taxcodeusstocks.com</a>，每一封我都會讀。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-digitalisation-of-the-economy-global-anti-base-erosion-model-rules-pillar-two_782bac33-en.html\" target=\"_blank\" rel=\"noopener\">OECD GloBE Model Rules<span class=\"sr-only\">（於新分頁開啟）</span></a>（2021 年 12 月）：Art 1.1（EUR 750M 合併營收門檻）、Art 1.2（MNE Group 定義）、Art 1.5（Excluded Entities，含 Investment Fund）、Art 10.1（定義）</li>\n      <li><a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-the-digitalisation-of-the-economy-commentary-to-the-global-anti-base-erosion-model-rules-pillar-two-first-edition_1e0e9cd8-en.html\" target=\"_blank\" rel=\"noopener\">OECD GloBE Commentary<span class=\"sr-only\">（於新分頁開啟）</span></a>（2025 年合併版）：Art 1.5 排除實體之政策理由（Chapter 1, Para. 42）</li>\n      <li><a href=\"https://eur-lex.europa.eu/eli/dir/2022/2523/oj/eng\" target=\"_blank\" rel=\"noopener\">EU Council Directive 2022/2523<span class=\"sr-only\">（於新分頁開啟）</span></a>（歐盟最低稅指令，投資基金排除規定）</li>\n      <li><a href=\"https://www.irishstatutebook.ie/eli/2023/act/39/enacted/en/html\" target=\"_blank\" rel=\"noopener\">Ireland Finance (No. 2) Act 2023<span class=\"sr-only\">（於新分頁開啟）</span></a>（IIR/QDTT 自 2023-12-31 以後開始之財年適用）及 Irish Revenue Pillar Two 指引</li>\n      <li><a href=\"https://www.irishstatutebook.ie/eli/2024/act/43/enacted/en/html\" target=\"_blank\" rel=\"noopener\">Ireland Finance Act 2024<span class=\"sr-only\">（於新分頁開啟）</span></a>（未納入合併財報之監管投資基金明文排除於 QDTT）</li>\n      <li><a href=\"https://www.irs.gov/businesses/international-businesses/ireland-tax-treaty-documents\" target=\"_blank\" rel=\"noopener\">美國愛爾蘭租稅協定<span class=\"sr-only\">（於新分頁開啟）</span></a>（股利預扣稅 15%）</li>\n      <li>法規查核日期：2026-07-10</li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>",
      "body_suggested": "<p>台灣投資人買愛爾蘭註冊 ETF（例如：VWRA、CSPX、VUAA，多數在倫敦交易所掛牌、基金註冊地在愛爾蘭），理由通常有三個：美國股利預扣稅從 30% 降到 15%、不用繳美國遺產稅、有累積型 ETF 不配息。</p>\n\n  <p>OECD 全球最低稅制度上路後，新聞標題寫著「避稅天堂愛爾蘭被迫加稅到 15%」，於是有人把公司稅的新聞讀成基金稅的風險。然結論很直接：愛爾蘭 ETF 不會被課這個 15%，因為規則設計上就把投資基金排除在外。</p>\n\n  <h2>第一層：全球最低稅負制不適用於 ETF</h2>\n\n  <p>全球最低稅負只適用於「跨國企業集團」（MNE Group）：合併財報營收達到 EUR 750M 門檻（前四個財務年度中至少兩年達標）、且至少有一個成員在母公司以外的國家。這裡有兩個常見誤解要先釐清：</p>\n\n  <ol>\n    <li>ETF 的「規模大」不等於「營收大」。VWRA 這種基金資產規模（AUM）幾百億美元，但 AUM 不是營收，門檻看的是合併財報上的收入。</li>\n    <li>更關鍵的是：ETF 沒有「合併報表」可言。基金持有幾千檔股票，但會計上是以公允價值列為投資，不會把 Apple、Microsoft 合併成子公司。沒有合併，就沒有 MNE Group，根本就不在課稅範圍內。</li>\n  </ol>\n\n  <p>此亦可由另一角度分析：全球最低稅抓的是合併營收達 EUR 750M 的跨國集團；ETF 的 AUM 再大，會計上仍是以公允價值列示的投資組合（亦即不合併被投資公司），故既無合併營收、亦無 MNE Group 可抓。規模大與營收大，不是同一件事。</p>\n\n  <p>ETF 也不會被併進資產管理公司的合併報表。BlackRock 管理 iShares 的基金、Vanguard 管理 VWRA，但基金資產屬於投資人，不屬於資產管理公司，一般情況下不會出現在 BlackRock 的合併財報（例外是種子資金等管理人持有重大自有部位的階段，見文末假設說明）。</p>\n\n  <h2>第二層：投資基金是明文排除實體</h2>\n\n  <p>即便某個基金真的構成集團最上層母公司，規則也把「投資基金」（Investment Fund）列為排除實體（Excluded Entity），也就是不在課稅範圍。這不是漏洞：投資基金在各國稅制下的定位是「稅務中性導管」（亦即基金層級不課稅或輕稅，課稅時點是投資人領到錢的時候，非在基金累積盈餘時先課一道）。</p>\n\n  <h2>第三層：愛爾蘭本國稅法怎麼規定</h2>\n\n  <p>愛爾蘭以 Finance (No. 2) Act 2023 導入全球最低稅負制：所得納入規則（IIR）與國內補充稅（QDTT）適用於 2023 年 12 月 31 日以後開始的財務年度。愛爾蘭的法令其實比歐盟法令更嚴，連沒有集團的獨立實體，自身營收超過 EUR 750M 也被納入課稅範圍。監管型投資基金（依愛爾蘭稅法定義，涵蓋 unit trust、ICAV、CCF、ILP，以及 VWRA、CSPX 這類 UCITS 投資公司 plc）是由 Finance Act 2024 明文排除在課稅範圍，前提是基金未被納入任何合併財報。</p>\n\n  <p>雖新聞把「愛爾蘭加稅到 15%」寫成對整個法域的制度轉向，但由於全球最低稅抓的是跨國集團公司、且監管型投資基金已被明文排除，故愛爾蘭基金稅制的核心（基金層級不課稅、對非居民投資人不扣繳）在導入全球最低稅負制之後完全不受影響。</p>\n\n  <div class=\"callout\">為什麼大家會誤會？因為新聞說的「愛爾蘭同意 15%」，指的是對大型跨國集團公司加稅（原本公司稅率 12.5%）。Apple 愛爾蘭子公司的稅、與你持有的愛爾蘭 ETF 的稅，是兩套完全不同的制度。標題把「愛爾蘭」三個字混在一起，讀者就把公司稅的新聞解讀成基金稅的風險。</div>\n\n  <h2>真正的影響在持股公司的有效稅率</h2>\n\n  <p>惟這不表示全球最低稅對你毫無影響：你的 ETF 持有的那些公司，有效稅率的下限被拉到 15%。爰此，真正要盯的是持股端的獲利，不是基金本身會不會被課 15%。</p>\n\n  <p>Apple、Microsoft、Alphabet 這些 ETF 前十大持股，全部都在課稅範圍內。過去依賴低稅法域壓低有效稅率（ETR）的空間已不存在：Apple FY2025 的 ETR 是 15.6%（FY2023 還在 14.7%，FY2024 因歐盟 State Aid 一次性稅費提高到 24.1%）；財報沒有「新常態」這三個字，這是我的判讀（分析見 <a href=\"apple-etr.html\">Apple 的稅務密碼</a>）。公司稅後盈餘微幅下修，反映在 EPS 和股價上，這才是全球最低稅負真正影響到 ETF 投資人的方式：<strong>透過持股的獲利，不是透過基金被課稅。</strong></p>\n\n  <h2>整理</h2>\n\n  <table>\n    <tr><th>層級</th><th>導入全球最低稅負前</th><th>導入全球最低稅負後</th></tr>\n    <tr><td>底層持股公司（Apple 等）</td><td>可利用低稅國壓低 ETR</td><td>ETR 拉高到 15%，壓低稅後盈餘</td></tr>\n    <tr><td>基金層級：美國股利預扣稅</td><td>15%（美愛租稅協定）</td><td>15%，不變</td></tr>\n    <tr><td>基金層級：愛爾蘭稅</td><td>不課稅</td><td>不課稅，不變（排除投資基金）</td></tr>\n    <tr><td>投資人層級：愛爾蘭扣繳</td><td>對非居民 0</td><td>0，不變</td></tr>\n    <tr><td>投資人層級：美國遺產稅</td><td>非 US-situs，不計入</td><td>不變（詳見<a href=\"treasury-etf-estate-tax.html\">公債 ETF 遺產稅</a>一文的 situs 分析）</td></tr>\n    <tr><td>投資人層級：台灣稅</td><td>海外所得，計入基本所得額</td><td>不變（多數人誤解的「750 萬免稅」，另文<a href=\"overseas-income-750-myth.html\">完整拆解</a>）</td></tr>\n  </table>\n\n  <h2>結論</h2>\n  <ol>\n    <li>愛爾蘭 ETF 不會被課 15% 全球最低稅負。</li>\n    <li>買愛爾蘭 ETF 的三個稅務考量（15% 股利稅、非美國遺產稅資產、累積型）在全球最低稅負制實施後不受影響，不需要改變資產配置。</li>\n    <li>真正的影響在持股端：ETF 的投資公司 ETR 未來合理預期會提高，但不是擔心基金被課稅。</li>\n  </ol>\n\n  <div class=\"assumption\">假設說明：本文以台灣稅務居民個人、持有愛爾蘭註冊 UCITS ETF（公開募集、廣泛持有）的一般情境為準。若基金實體被納入某集團合併財報（例如集團自設的基金 SPV、種子資金階段的基金），適用性需個案判斷。各國落地法細節持續更新中，重大部位請以當時法令個案確認。</div>\n\n  <div class=\"cta-box\">\n    <h4>讀完有想法？</h4>\n    <p>對這篇有問題、有不同看法，或想指定下一個主題，歡迎來信 <a href=\"mailto:hello@taxcodeusstocks.com?subject=Re:%20irish-etf-pillar-two\">hello@taxcodeusstocks.com</a>，每一封我都會讀。</p>\n  </div>\n\n  <div class=\"sources\">\n    <h4>資料來源</h4>\n    <ul>\n      <li><a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-digitalisation-of-the-economy-global-anti-base-erosion-model-rules-pillar-two_782bac33-en.html\" target=\"_blank\" rel=\"noopener\">OECD GloBE Model Rules<span class=\"sr-only\">（於新分頁開啟）</span></a>（2021 年 12 月）：Art 1.1（EUR 750M 合併營收門檻）、Art 1.2（MNE Group 定義）、Art 1.5（Excluded Entities，含 Investment Fund）、Art 10.1（定義）</li>\n      <li><a href=\"https://www.oecd.org/en/publications/tax-challenges-arising-from-the-digitalisation-of-the-economy-commentary-to-the-global-anti-base-erosion-model-rules-pillar-two-first-edition_1e0e9cd8-en.html\" target=\"_blank\" rel=\"noopener\">OECD GloBE Commentary<span class=\"sr-only\">（於新分頁開啟）</span></a>（2025 年合併版）：Art 1.5 排除實體之政策理由（Chapter 1, Para. 42）</li>\n      <li><a href=\"https://eur-lex.europa.eu/eli/dir/2022/2523/oj/eng\" target=\"_blank\" rel=\"noopener\">EU Council Directive 2022/2523<span class=\"sr-only\">（於新分頁開啟）</span></a>（歐盟最低稅指令，投資基金排除規定）</li>\n      <li><a href=\"https://www.irishstatutebook.ie/eli/2023/act/39/enacted/en/html\" target=\"_blank\" rel=\"noopener\">Ireland Finance (No. 2) Act 2023<span class=\"sr-only\">（於新分頁開啟）</span></a>（IIR/QDTT 自 2023-12-31 以後開始之財年適用）及 Irish Revenue Pillar Two 指引</li>\n      <li><a href=\"https://www.irishstatutebook.ie/eli/2024/act/43/enacted/en/html\" target=\"_blank\" rel=\"noopener\">Ireland Finance Act 2024<span class=\"sr-only\">（於新分頁開啟）</span></a>（未納入合併財報之監管投資基金明文排除於 QDTT）</li>\n      <li><a href=\"https://www.irs.gov/businesses/international-businesses/ireland-tax-treaty-documents\" target=\"_blank\" rel=\"noopener\">美國愛爾蘭租稅協定<span class=\"sr-only\">（於新分頁開啟）</span></a>（股利預扣稅 15%）</li>\n      <li>法規查核日期：2026-07-10</li>\n    </ul>\n  </div>\n\n  <div class=\"disclaimer-box\">本文為教育性質與個人觀點，不構成稅務專業意見。個案情境請諮詢合格稅務專業人員。作者可能持有文中討論之證券部位。完整免責聲明見<a href=\"../disclaimer.html\">此頁</a>。</div>"

      "title_original": "Apple 的稅務密碼：ETR 從 14.7% 飆到 24.1%，再回到 15.6%，發生了什麼事",
      "title_suggested": "Apple 有效稅率：從 14.7% 到 24.1%，再回到 15.6%",
      "description_original": "Apple 五年有效稅率完整拆解：四個結構性密碼、歐盟 State Aid 一次性補稅 USD 10.2B、Pillar Two 之後的新常態。",
      "description_suggested": "Apple 五年有效稅率拆解：海外營運、GILTI 與 FDII、研發抵減與股份薪酬如何把 21% 壓到 13% 至 16%，以及 FY2024 歐盟 State Aid 一次性補稅 USD 10.2B、Pillar Two 之後的新常態。",
      "issues": [

        "「這篇拆兩件事」「這不是災難等級的數字」屬 signposting 與恐嚇用語",
